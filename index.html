<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231D4ED8'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='800' font-size='28' fill='white' text-anchor='middle'%3EAa%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>So'z Sandig'i</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600;700&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: one column "desk" — folder tabs grid on home, a single big index card in study mode. Ikat-stripe band is the one bold motif. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8ECF4; --fg:#111A2E; --muted:#596379; --line:#D8DEEA;
  --accent:#1D4ED8; --accent-soft:#DCE6FF; --accent-ink:#FFFFFF;
  --teal:#0E9F9A; --sun:#E9A100; --good:#178A4F; --good-soft:#DDF3E6; --bad:#C93B3B; --bad-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(17,26,46,.06),0 8px 24px rgba(17,26,46,.08);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1120; --surface:#151C2F; --surface-2:#1C2540; --fg:#E8ECF6; --muted:#97A1B8; --line:#26304A;
  --accent:#7196FF; --accent-soft:#1E2B55; --accent-ink:#0C1120;
  --teal:#2CC6C0; --sun:#FFC23D; --good:#3FCB82; --good-soft:#123426; --bad:#FF6F6F; --bad-soft:#3A1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1120; --surface:#151C2F; --surface-2:#1C2540; --fg:#E8ECF6; --muted:#97A1B8; --line:#26304A;
  --accent:#7196FF; --accent-soft:#1E2B55; --accent-ink:#0C1120;
  --teal:#2CC6C0; --sun:#FFC23D; --good:#3FCB82; --good-soft:#123426; --bad:#FF6F6F; --bad-soft:#3A1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ikat{height:10px;border-radius:6px;background:
  repeating-linear-gradient(135deg,var(--accent) 0 8px,transparent 8px 16px),
  repeating-linear-gradient(45deg,var(--sun) 0 8px,var(--teal) 8px 16px);opacity:.9}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:18px;position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(90deg,var(--sun) 0 6px,var(--teal) 6px 12px)}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--good)}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}

/* hero stats */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:16px;box-shadow:var(--shadow)}
.hero-row{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring b{font-family:var(--f-display);font-size:28px;font-weight:800;display:block;font-variant-numeric:tabular-nums}
.ring small{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.goalbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{background:transparent}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.45;cursor:default}

/* folders */
.sec-h{display:flex;justify-content:space-between;align-items:end;margin:28px 0 12px;gap:12px}
.sec-h h2{font-size:22px}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.folder{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:16px 14px 14px;display:grid;gap:8px;transition:transform .15s,box-shadow .15s;min-width:0;margin-top:12px}
.folder::before{content:"";position:absolute;top:-12px;left:-1px;width:58%;height:13px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:10px 12px 0 0}
.folder:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.folder .fn{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.folder .range{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.folder .bar i{display:block;height:100%;background:var(--accent)}
.folder .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.folder.done{border-color:var(--good)}
.folder.done::before{border-color:var(--good);background:var(--good-soft)}
.folder.done .fn{color:var(--good)}
.folder.done .bar i{background:var(--good)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.badge.star{background:color-mix(in srgb,var(--sun) 22%,transparent);color:var(--fg)}
.badge.go{background:var(--accent-soft);color:var(--accent)}

/* folder view */
.fhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.fhead h2{font-size:24px}
.fhead .sub{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:14px;margin-bottom:18px;overflow-x:auto}
.tab{flex:1;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.tab svg{width:17px;height:17px}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* flashcard */
.study{display:grid;gap:16px;max-width:560px;margin:0 auto}
.sprog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sprog .goalbar{flex:1}
.sprog .goalbar i{background:var(--accent)}
.scene{perspective:1200px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{position:relative;height:340px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 22px;text-align:center;gap:10px;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face .band{position:absolute;left:0;right:0;top:0;height:10px;border-radius:0}
.face .num{position:absolute;top:20px;left:18px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.face .st{position:absolute;top:18px;right:16px}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,11vw,60px);letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
.ipa{font-family:var(--f-ipa);font-size:20px;color:var(--muted)}
.read{font-size:16px;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:10px;font-weight:600;letter-spacing:.02em}
.read small{font-weight:500;opacity:.8;margin-right:4px}
.trans{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1.15;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted);position:absolute;bottom:16px;left:0;right:0}
.speak{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.speak svg{width:24px;height:24px}
.speak.sm{width:38px;height:38px;box-shadow:none}
.speak.sm svg{width:18px;height:18px}
.speak.soft{background:var(--accent-soft);color:var(--accent)}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer .btn{min-height:58px;font-size:17px}
.kbd{font-size:12px;color:var(--muted);text-align:center}
.card.swl{transform:translateX(-120%) rotate(-12deg);opacity:0;transition:transform .3s,opacity .3s}
.card.swr{transform:translateX(120%) rotate(12deg);opacity:0;transition:transform .3s,opacity .3s}
.card.flip.swl{transform:rotateY(180deg) translateX(120%) rotate(12deg)}
.card.flip.swr{transform:rotateY(180deg) translateX(-120%) rotate(-12deg)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.row .w{font-weight:700;font-size:17px}
.row .ip{font-family:var(--f-ipa);color:var(--muted);font-size:14px;margin-left:6px;font-weight:400}
.row .t{font-size:14px;color:var(--muted)}
.row .rd{font-size:13px;color:var(--accent);font-weight:600}
.row .acts{display:flex;align-items:center;gap:6px}
.stbtn{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.stbtn.s1{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 25%,transparent)}
.stbtn.s2{border-color:var(--good);background:var(--good);color:#fff}
.stbtn svg{width:14px;height:14px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;margin-bottom:12px}

/* sentences */
.sents{display:grid;gap:10px}
.sent{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.sent .en{font-size:19px;font-weight:600;line-height:1.35}
.sent mark{background:transparent;color:var(--accent);font-weight:800;border-bottom:2px solid var(--sun)}
.sent .uz{font-size:15px;color:var(--muted);margin-top:4px}
.reveal{font-size:13px;color:var(--accent);font-weight:600;margin-top:4px;text-decoration:underline;text-underline-offset:3px}

/* test & practice */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow);display:grid;gap:16px;text-align:center}
.qtype{display:inline-flex;align-self:center;justify-self:center}
.qmain{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,46px);line-height:1.1;overflow-wrap:anywhere}
.qsent{font-size:21px;font-weight:600;line-height:1.4}
.qsent .gap{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;min-height:56px;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.tin{width:100%;padding:14px;font-size:22px;text-align:center;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font-family:var(--f-display);font-weight:700}
.tin.ok{border-color:var(--good)} .tin.no{border-color:var(--bad)}
.fb{font-weight:600;min-height:24px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tile{padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:17px}
.built{min-height:60px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.built .tile{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.built.ok{border-color:var(--good);border-style:solid} .built.no{border-color:var(--bad);border-style:solid}
.result{text-align:center;display:grid;gap:14px;justify-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px;color:var(--sun)}
.stars svg{width:34px;height:34px}
.stars .off{color:var(--line)}
.wrongs{width:100%;text-align:left}

.empty{text-align:center;padding:30px 16px;display:grid;gap:12px;justify-items:center}
.empty h3{font-size:24px}
.stamp{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--good);border:3px solid var(--good);border-radius:10px;padding:6px 14px;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-6deg) scale(1.8);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}

/* settings sheet */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:grid;align-items:end;justify-items:center;z-index:50;padding-top:40px}
.sheet .in{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;max-height:85vh;overflow:auto}
.set{display:grid;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));box-shadow:var(--shadow);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.help{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.help b{color:var(--fg)}

/* selection + bulk */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.sm svg{width:16px;height:16px}
.ranges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ranges .chip{font-size:13px;padding:6px 10px;font-variant-numeric:tabular-nums}
.row.sel{background:var(--accent-soft)}
.list .row{grid-template-columns:28px 30px minmax(0,1fr) auto}
.ck{width:22px;height:22px;accent-color:var(--accent);cursor:pointer;margin:0}
.selbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--fg);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:var(--shadow);z-index:5}
.selbar b{margin-right:auto;font-variant-numeric:tabular-nums}
.selbar .btn{background:color-mix(in srgb,var(--bg) 14%,transparent);border-color:transparent;color:var(--bg)}
.selbar .btn.primary{background:var(--accent);color:var(--accent-ink)}
.toast{display:flex;gap:12px;align-items:center}
.toast button{color:var(--sun);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* exam */
.mic{width:76px;height:76px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;justify-self:center;position:relative;flex:none}
.mic svg{width:32px;height:32px}
.mic.sm{width:54px;height:54px} .mic.sm svg{width:24px;height:24px}
.mic.on{background:var(--bad)}
.mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.ansrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.ansrow .tin{font-size:20px}
.cfg{display:grid;gap:16px;text-align:left}
.cfg .set{gap:6px}
.reslist{display:grid;gap:6px;text-align:left;width:100%}
.resrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.resrow>svg{width:16px;height:16px}
.resrow .ok{color:var(--good)} .resrow .no{color:var(--bad)}
.youans{font-size:14px;color:var(--muted)}

@media (max-width:560px){
  .hero-row{grid-template-columns:1fr;justify-items:center;text-align:center}
  .stats{width:100%}
  .folders{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:8px 4px}
  .card{height:320px}
  .opts{grid-template-columns:1fr}
  .selbar b{flex-basis:100%}
  .selbar .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- state ---------- */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function blank(){return {L:'0'.repeat(N),best:{},days:{},goal:20,auto:true,rate:1,dir:'en',size:20}}
let P=blank();
try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); P=Object.assign(blank(),o); if(typeof P.L!=='string'||P.L.length!==N) P.L=(P.L||'').padEnd(N,'0').slice(0,N);}}catch(e){}
const lvl=i=>+P.L[i];
function setLvl(i,v){ if(lvl(i)===v) return; if(v===2&&lvl(i)!==2){const t=today(); P.days[t]=(P.days[t]||0)+1;} P.L=P.L.slice(0,i)+v+P.L.slice(i+1); save(); }
function setMany(ids,v){ const a=P.L.split(''); for(const i of ids) a[i]=String(v); P.L=a.join(''); save(); }
function bulk(ids,v,msg){ const prev=P.L; setMany(ids,v); toast(msg,'Qaytarish',()=>{P.L=prev; save(); if(sess) view.restart=true; rerender();}); }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){} queueCloud(); }
const known=()=>{let c=0;for(let i=0;i<N;i++) if(P.L.charCodeAt(i)===50) c++; return c};
const fKnown=f=>{let c=0;for(let i=f*100;i<Math.min(N,f*100+100);i++) if(P.L.charCodeAt(i)===50) c++; return c};
const fSize=f=>Math.min(100,N-f*100);
function streak(){let s=0;const d=new Date(); if(!P.days[today()]) d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(P.days[k]>0){s++;d.setDate(d.getDate()-1)} else break;} return s}

/* ---------- cloud sync (same account on phone + computer) ---------- */
let ref=null, cloudOn=false, writing=false, dirty=false, tmr=null;
function mergeIn(r){ if(!r) return false; let ch=false;
  if(typeof r.L==='string'&&r.L.length===N){let s='';for(let i=0;i<N;i++){const a=P.L[i],b=r.L[i];const m=a>b?a:b; s+=m; if(m!==a) ch=true;} P.L=s;}
  for(const k in (r.best||{})) if((r.best[k]||0)>(P.best[k]||0)){P.best[k]=r.best[k];ch=true}
  for(const k in (r.days||{})) if((r.days[k]||0)>(P.days[k]||0)){P.days[k]=r.days[k];ch=true}
  return ch }
function sameAs(r){ if(!r||r.L!==P.L) return false; for(const k in P.best) if((r.best||{})[k]!==P.best[k]) return false; for(const k in P.days) if((r.days||{})[k]!==P.days[k]) return false; return true }
function queueCloud(){ if(!cloudOn) return; dirty=true; clearTimeout(tmr); tmr=setTimeout(flush,2500) }
async function flush(){ if(!cloudOn||writing||!dirty) return; writing=true; dirty=false;
  try{ await ref.set({L:P.L,best:P.best,days:P.days,at:Date.now()}); setSync(true) }catch(e){ setSync(false) }
  writing=false; if(dirty) tmr=setTimeout(flush,2500) }
function setSync(on){ cloudOn=on&&!!ref; const el=document.getElementById('sync'); if(el) el.innerHTML=syncHTML() }
const syncHTML=()=>cloudOn?'<span class="dot on"></span>Telefon va kompyuter bilan sinxron':'<span class="dot on"></span>Natijalar shu qurilmada saqlanadi';
(async function initCloud(){ try{
  if(!window.claude||!window.claude.use) return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user) return; const id=await user.id(); if(!id) return;
  ref=db.doc('data/users/'+id+'/progress');
  const snap=await ref.get(); const r=snap.exists?snap.data():null;
  const ch=mergeIn(r); try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}
  cloudOn=true; setSync(true); if(ch) rerender();
  if(!sameAs(r)) {dirty=true; flush()}
  ref.onSnapshot(s=>{ if(!s.exists||s.metadata.hasPendingWrites) return; const d=s.data(); if(mergeIn(d)){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){} if(view.name==='home') rerender(); } if(!sameAs(d)) queueCloud(); },()=>{});
 }catch(e){ cloudOn=false } })();

/* ---------- speech ---------- */
let voice=null;
function pickVoice(){ try{const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny|Natural|Ava|Allison/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){} }
if('speechSynthesis' in window){ pickVoice(); try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){} }
let warned=false;
function speak(t,rate){ if(!('speechSynthesis' in window)){ if(!warned){toast("Bu brauzer ovozni qo'llamaydi. Chrome yoki Safari'da oching.");warned=true} return }
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; if(voice) u.voice=voice; u.rate=rate||P.rate; speechSynthesis.speak(u);}catch(e){} }

/* ---------- utils ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const idxs=f=>{const a=[];for(let i=f*100;i<f*100+fSize(f);i++)a.push(i);return a};
const tr1=i=>W[i][3].split(';')[0].trim();
function toast(m,btn,fn){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; const s=document.createElement('span'); s.textContent=m; t.appendChild(s);
  if(btn){ const b=document.createElement('button'); b.textContent=btn; b.onclick=()=>{fn();t.remove()}; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(()=>t.remove(),btn?7000:2600) }
const pad=n=>String(n).padStart(2,'0');
function ringSVG(p,size){const r=52,c=2*Math.PI*r;return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>`}
const readHTML=i=>`<span class="read"><small>o'qilishi:</small>${esc(W[i][2])}</span>`;

/* ---------- router ---------- */
let view={name:'home'};
function go(v){ if(typeof stopMic==='function') stopMic(); view=v; try{speechSynthesis.cancel()}catch(e){} rerender(); window.scrollTo({top:0}); }
function rerender(){ if(view.name==='home') renderHome(); else if(view.name==='exam') renderExamPage(); else renderFolder(); }
function renderExamPage(){
  $app.innerHTML=`<header class="fhead"><button class="iconbtn" data-act="home" aria-label="Orqaga">${I.back}</button><div style="min-width:0;flex:1"><h2>Sinov</h2><div class="sub">Barcha papkalardan yodlangan ${known()} ta so'z</div></div></header><div id="pane"></div>`;
  paneExam(document.getElementById('pane'),null);
}

function nextFolder(){ for(let f=0;f<FOLDERS;f++) if(fKnown(f)<fSize(f)) return f; return 0 }

  let h=`<header class="top"><div class="brand"><div class="logo">Aa</div><div><h1>So'z Sandig'i</h1><div class="sync" id="sync">${syncHTML()}</div></div></div>
  <button class="iconbtn" data-act="settings" aria-label="Sozlamalar">${I.gear}</button></header>
  <section class="hero"><div class="ikat"></div>
   <div class="hero-row"><div class="ring">${ringSVG(k/N)}<div class="num"><div><b>${k}</b><small>/ ${N} so'z</small></div></div></div>
    <div style="display:grid;gap:14px;min-width:0;width:100%">
     <div class="stats"><div class="stat"><b>${td}</b><span>bugun</span></div><div class="stat"><b>${st}</b><span>kun ketma-ket</span></div><div class="stat"><b>${Math.round(k/N*100)}%</b><span>umumiy</span></div></div>
     <div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span class="muted">Kunlik maqsad</span><b style="font-variant-numeric:tabular-nums">${Math.min(td,P.goal)} / ${P.goal}</b></div><div class="goalbar"><i style="width:${Math.min(100,td/P.goal*100)}%"></i></div></div>
    </div></div>
   <div class="cta"><button class="btn primary" data-act="open" data-f="${nf}" data-tab="cards">${I.play} Davom etish: ${nf+1}-papka</button>
   <button class="btn" data-act="exampage" ${k<1?'disabled':''}>${I.mic} Yodlanganlardan sinov</button>
   <button class="btn" data-act="mixreview" ${k<5?'disabled':''}>${I.shuffle} Aralash takrorlash</button></div>
  </section>
  <div class="sec-h"><div><div class="label">Kartochka papkalari</div><h2>${FOLDERS} ta papka, har birida 100 ta so'z</h2></div></div>
  <div class="folders">`;
  for(let f=0;f<FOLDERS;f++){
    const n=fKnown(f), s=fSize(f), done=n>=s, b=P.best[f];
    const first=W[f*100][0], last=W[f*100+s-1][0];
    h+=`<button class="folder${done?' done':''}" data-act="open" data-f="${f}" data-tab="cards" aria-label="${f+1}-papka">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:6px"><span class="fn">${pad(f+1)}</span>${b!=null?`<span class="badge star">${I.star.replace('<svg','<svg width="11" height="11"')} ${b}%</span>`:(f===nf&&!done?'<span class="badge go">Navbatda</span>':'')}</div>
      <div class="range">${esc(first)} → ${esc(last)}</div>
      <div class="bar"><i style="width:${n/s*100}%"></i></div>
      <div class="meta"><span>${n}/${s}</span><span>${done?'Yodlandi':n?'Jarayonda':'Yangi'}</span></div></button>`;
  }
  h+=`</div>
  <div class="help" style="margin-top:22px"><b>Qanday ishlaydi:</b> papkani oching → kartochkani bosib tarjimasini ko'ring → <b>Bilaman</b> yoki <b>Bilmayman</b> ni bosing (telefonda o'ngga yoki chapga suring). Bilmagan so'zlaringiz qayta-qayta chiqadi. 100 ta so'z tugagach, <b>Gaplar</b> va <b>Test</b> bo'limlarida mustahkamlang, <b>Sinov</b> bo'limida esa javobni ovoz bilan aytib yoki yozib tekshiring. <b>Ro'yxat</b> bo'limida xohlagan so'zlaringizni tanlab o'rganishingiz yoki barcha belgilarni bir bosishda qo'yib yoki olib tashlashingiz mumkin. O'qilishidagi <b>KATTA</b> bo'g'in urg'uli; <b>ə</b> "a" bilan "e" orasidagi qisqa tovush; <b>th</b> va <b>dh</b> tilni tishlar orasiga qo'yib aytiladi.</div>`;
  $app.innerHTML=h;
}

/* ---------- folder ---------- */
const TABS=[['cards','Kartochkalar',I.cards],['list',"Ro'yxat",I.list],['sents','Gaplar',I.chat],['test','Test',I.test],['exam','Sinov',I.mic]];

   <nav class="tabs">${TABS.map(t=>`<button class="tab${view.tab===t[0]?' on':''}" data-act="tab" data-tab="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join('')}</nav><div id="pane"></div>`;

/* ----- flashcards ----- */
let sess=null;
function startSession(f,mode,custom){
  let q;
  if(custom) q=custom.slice();
  else if(mode==='review') q=shuf(idxs(f).filter(i=>lvl(i)===2));
  else { const a=idxs(f).filter(i=>lvl(i)!==2); q=a.filter(i=>lvl(i)===1).concat(a.filter(i=>lvl(i)===0)); }
  if(!custom && P.size!=='all') q=q.slice(0,+P.size);
  sess={f,mode,q,pos:0,total:q.length,good:0,bad:0,flip:false,seen:new Set(),custom:!!custom};
}
function paneCards(pane,f){
  if(!sess||sess.f!==f||view.restart){ startSession(f,view.mode||'new',view.custom); view.restart=false; view.custom=null; }
  const mode=sess.mode;
  let h=`<div class="study"><div class="chips">
    <button class="chip${mode==='new'&&!sess.custom?' on':''}" data-act="mode" data-mode="new">O'rganish</button>
    <button class="chip${mode==='review'?' on':''}" data-act="mode" data-mode="review" ${fKnown(f)?'':'disabled'}>Takrorlash (${fKnown(f)})</button>
    ${sess.custom?`<button class="chip on" data-act="mode" data-mode="${mode}">Tanlangan: ${sess.total}</button>`:''}
    <span style="flex:1"></span>
    <button class="chip" data-act="dir">${P.dir==='en'?'EN → UZ':'UZ → EN'}</button></div>
   <div class="toolbar"><button class="btn sm" data-act="gopick">${I.pick} Tanlab o'rganish</button><button class="btn sm" data-act="restartf" ${fKnown(f)||idxs(f).some(i=>lvl(i)===1)?'':'disabled'}>${I.restart} Papkani qaytadan boshlash</button></div>`;
  if(!sess.q.length){
    const all=fKnown(f)>=fSize(f);
    h+=`<div class="qbox empty">${all?'<div class="stamp">Papka yodlandi</div>':''}<h3>${all?"Barakalla! 100 ta so'zning hammasini bilasiz":sess.total?"Seans tugadi":"Bu yerda hozircha so'z yo'q"}</h3>
      <p class="muted">${sess.total?`${sess.total} ta kartochka ko'rildi. ${fKnown(f)}/${fSize(f)} so'z yodlandi.`:''} ${all?"Endi gaplar va test bilan mustahkamlang.":''}</p>
      <div class="cta" style="justify-content:center">${all?`<button class="btn primary" data-act="tab" data-tab="test">${I.test} Testni boshlash</button><button class="btn" data-act="tab" data-tab="sents">${I.chat} Gaplar</button>`:`<button class="btn primary" data-act="mode" data-mode="new">Yana davom etish</button>`}
      ${f+1<FOLDERS&&all?`<button class="btn" data-act="open" data-f="${f+1}" data-tab="cards">${f+2}-papka</button>`:''}</div></div></div>`;
    pane.innerHTML=h; return;
  }
  const i=sess.q[0], en=P.dir==='en';
  const lv=lvl(i);
  const stB=lv===1?'<span class="badge" style="background:color-mix(in srgb,var(--sun) 25%,transparent);color:var(--fg)">Qiyin</span>':lv===2?'<span class="badge" style="background:var(--good-soft);color:var(--good)">Bilaman</span>':'<span class="badge go">Yangi</span>';
  const front=en?`<div class="word">${esc(W[i][0])}</div><div class="ipa">${esc(W[i][1])}</div>${readHTML(i)}<button class="speak" data-act="say" data-i="${i}" aria-label="Eshitish">${I.speak}</button>`
                :`<div class="trans">${esc(W[i][3])}</div><div class="hint">Inglizchasini eslang, keyin kartochkani bosing</div>`;
  const back=en?`<div class="trans">${esc(W[i][3])}</div><div style="display:flex;align-items:center;gap:10px"><span style="font-weight:700;font-size:20px">${esc(W[i][0])}</span><button class="speak sm soft" data-act="say" data-i="${i}" aria-label="Eshitish">${I.speak}</button></div>${readHTML(i)}`
                :`<div class="word">${esc(W[i][0])}</div><div class="ipa">${esc(W[i][1])}</div>${readHTML(i)}<button class="speak" data-act="say" data-i="${i}" aria-label="Eshitish">${I.speak}</button>`;
  const done=sess.total-sess.q.length+sess.good*0;
  h+=`<div class="sprog"><span>${Math.min(sess.good,sess.total)}/${sess.total}</span><div class="goalbar"><i style="width:${sess.good/sess.total*100}%"></i></div><span>${fKnown(f)}/${fSize(f)}</span></div>
   <div class="scene" id="scene"><div class="card${sess.flip?' flip':''}" id="card" tabindex="0" role="button" aria-label="Kartochkani aylantirish">
    <div class="face front"><div class="band ikat"></div><span class="num">#${i+1}</span><span class="st">${stB}</span>${front}${en?'<div class="hint">Tarjimasini ko\'rish uchun bosing</div>':''}</div>
    <div class="face back"><div class="band ikat"></div><span class="num">#${i+1}</span>${back}</div></div></div>
   <div class="answer"><button class="btn bad" data-act="ans" data-k="0">${I.x} Bilmayman</button><button class="btn good" data-act="ans" data-k="1">${I.check} Bilaman</button></div>
   <div class="kbd">Kompyuterda: Probel — aylantirish, ← bilmayman, → bilaman, S — eshitish</div></div>`;
  pane.innerHTML=h;
  if(P.auto && en && !sess.seen.has(i)){ sess.seen.add(i); setTimeout(()=>speak(W[i][0]),150); }
  bindSwipe();
}
function flipCard(){ if(!sess||!sess.q.length) return; sess.flip=!sess.flip; const c=document.getElementById('card'); if(c) c.classList.toggle('flip',sess.flip);
  if(sess.flip&&P.dir==='uz'&&P.auto) speak(W[sess.q[0]][0]); }
function answer(k){
  if(!sess||!sess.q.length) return; const i=sess.q.shift(); const c=document.getElementById('card');
  if(k){ setLvl(i,2); sess.good++; }
  else { setLvl(i, 1); sess.bad++; const at=Math.min(sess.q.length,3+(Math.random()*3|0)); sess.q.splice(at,0,i); sess.seen.delete(i); }
  sess.flip=false;
  if(c){ c.classList.add(k?'swr':'swl'); setTimeout(()=>{ const pane=document.getElementById('pane'); if(pane&&view.tab==='cards') paneCards(pane,view.f); refreshSub(); },220); }
}
function refreshSub(){ const s=document.querySelector('.fhead .sub'); if(s){const f=view.f;s.textContent=`${fKnown(f)}/${fSize(f)} so'z yodlandi · ${W[f*100][0]} → ${W[f*100+fSize(f)-1][0]}`} }
function bindSwipe(){
  const sc=document.getElementById('scene'), c=document.getElementById('card'); if(!sc) return;
  let x0=null,y0=0,dx=0,moved=false;
  sc.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; x0=e.clientX;y0=e.clientY;dx=0;moved=false; });
  sc.addEventListener('pointermove',e=>{ if(x0==null) return; dx=e.clientX-x0; if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(e.clientY-y0)){moved=true; c.style.transition='none'; c.style.transform=(sess.flip?'rotateY(180deg) ':'')+`translateX(${sess.flip?-dx:dx}px) rotate(${(sess.flip?-dx:dx)/20}deg)`;} });
  const end=e=>{ if(x0==null) return; const d=dx; x0=null; c.style.transition=''; c.style.transform='';
    if(moved&&Math.abs(d)>90){ answer(d>0?1:0) } else if(!moved && !(e.target.closest&&e.target.closest('button')) && e.type==='pointerup') flipCard(); };
  sc.addEventListener('pointerup',end); sc.addEventListener('pointercancel',end);
}

/* ----- list ----- */
function paneList(pane,f){
  const flt=view.flt||'all', q=(view.q||'').toLowerCase();
  let a=idxs(f); if(flt==='new') a=a.filter(i=>lvl(i)!==2); if(flt==='known') a=a.filter(i=>lvl(i)===2);
  if(q) a=a.filter(i=>W[i][0].toLowerCase().includes(q)||W[i][3].toLowerCase().includes(q));
  view.listIds=a;
  const sel=view.sel||(view.sel=new Set());
  const allSel=a.length>0&&a.every(i=>sel.has(i));
  const base=f*100, rs=[];
  for(let s=0;s<fSize(f);s+=20) rs.push([s,Math.min(fSize(f),s+20)]);
  let h=`<input class="search" id="q" type="search" placeholder="Qidirish: inglizcha yoki o'zbekcha" value="${esc(view.q||'')}">
   <div class="chips"><button class="chip${flt==='all'?' on':''}" data-act="flt" data-v="all">Hammasi</button><button class="chip${flt==='new'?' on':''}" data-act="flt" data-v="new">O'rganilmagan</button><button class="chip${flt==='known'?' on':''}" data-act="flt" data-v="known">Yodlangan</button></div>
   <div class="toolbar"><button class="btn sm" data-act="markall" data-v="2" ${a.length?'':'disabled'}>${I.check} Barchasini belgilash</button><button class="btn sm" data-act="markall" data-v="0" ${a.some(i=>lvl(i))?'':'disabled'}>${I.x} Barcha belgilarni olib tashlash</button></div>
   <div class="ranges"><span class="label" style="margin-right:4px">Tanlash:</span><button class="chip${allSel?' on':''}" data-act="selall">Hammasi</button>${rs.map(([x,y])=>{const ids=[];for(let j=x;j<y;j++)ids.push(base+j);const on=ids.every(i=>sel.has(i));return `<button class="chip${on?' on':''}" data-act="selrange" data-a="${base+x}" data-b="${base+y}">${base+x+1}–${base+y}</button>`}).join('')}${sel.size?`<button class="chip" data-act="selnone">Tozalash</button>`:''}</div>
   <div class="list">`;
  for(const i of a){ const l=lvl(i), on=sel.has(i);
    h+=`<div class="row${on?' sel':''}"><input type="checkbox" class="ck" data-act="sel" data-i="${i}" ${on?'checked':''} aria-label="${esc(W[i][0])} tanlash"><span class="n">${i+1}</span><div style="min-width:0"><div><span class="w">${esc(W[i][0])}</span><span class="ip">${esc(W[i][1])}</span></div><div class="rd">${esc(W[i][2])}</div><div class="t">${esc(W[i][3])}</div></div>
     <div class="acts"><button class="speak sm soft" data-act="say" data-i="${i}" aria-label="Eshitish">${I.speak}</button><button class="stbtn s${l}" data-act="cyc" data-i="${i}" aria-label="Yodlandi belgisi">${l===2?I.check:''}</button></div></div>`; }
  if(!a.length) h+=`<div class="row" style="grid-template-columns:1fr"><span class="muted">Hech narsa topilmadi.</span></div>`;
  h+='</div>';
  if(sel.size) h+=`<div class="selbar"><b>${sel.size} ta tanlandi</b><button class="btn sm primary" data-act="studysel">${I.cards} Yodlash</button><button class="btn sm" data-act="examsel">${I.mic} Sinov</button><button class="btn sm" data-act="marksel" data-v="2">${I.check} Belgilash</button><button class="btn sm" data-act="marksel" data-v="0">${I.x} Belgini olish</button></div>`;
  pane.innerHTML=h;
  const inp=document.getElementById('q'); inp.addEventListener('input',()=>{view.q=inp.value; const p=inp.selectionStart; paneList(pane,f); const n=document.getElementById('q'); n.focus(); try{n.setSelectionRange(p,p)}catch(e){} });
}

/* ----- sentences ----- */
function hl(en,key){ const re=new RegExp('\\b('+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i'); return esc(en).replace(re,'<mark>$1</mark>') }
function paneSents(pane,f){
  if(view.build) return paneBuild(pane,f);
  const ss=S[f]||[]; view.open=view.open||{};
  let h=`<div class="chips"><button class="btn primary" data-act="build">${I.chat} Gap tuzish mashqi</button><span class="muted" style="font-size:14px">Gapni eshiting, ovoz chiqarib takrorlang.</span></div><div class="sents">`;
  ss.forEach((s,k)=>{ h+=`<div class="sent"><button class="speak sm" data-act="sayt" data-t="${esc(s[1])}" aria-label="Eshitish">${I.speak}</button><div style="min-width:0"><div class="en">${hl(s[1],s[0])}</div>${view.open[k]?`<div class="uz">${esc(s[2])}</div>`:`<button class="reveal" data-act="rev" data-k="${k}">Tarjimasini ko'rish</button>`}</div></div>` });
  pane.innerHTML=h+'</div>';
}
const toks=s=>s.split(/\s+/).filter(Boolean);
function paneBuild(pane,f){
  const b=view.build; const ss=S[f]; const s=ss[b.k];
  if(!b.pool){ const t=toks(s[1]); b.pool=shuf(t.map((w,j)=>({w,j}))); if(b.pool.map(x=>x.w).join(' ')===s[1]&&t.length>1) b.pool.reverse(); b.picked=[]; b.state=null; }
  let h=`<div class="qbox"><div class="label">Gap tuzish · ${b.k+1}/${ss.length}</div><div class="qsent" style="font-size:19px">${esc(s[2])}</div>
   <div class="built ${b.state||''}" id="built">${b.picked.map((x,n)=>`<button class="tile" data-act="unpick" data-n="${n}">${esc(x.w)}</button>`).join('')||'<span class="muted" style="font-size:14px">So\'zlarni tartib bilan bosing</span>'}</div>
   <div class="tiles">${b.pool.map((x,n)=>x.used?'':`<button class="tile" data-act="pick" data-n="${n}">${esc(x.w)}</button>`).join('')}</div>
   <div class="fb ${b.state||''}">${b.state==='ok'?"To'g'ri!":b.state==='no'?'To\'g\'ri javob: '+esc(s[1]):''}</div>
   <div class="cta" style="justify-content:center">${b.state?`<button class="btn primary" data-act="bnext">${b.k+1<ss.length?'Keyingi gap':'Tugatish'}</button><button class="btn" data-act="sayt" data-t="${esc(s[1])}">${I.speak} Eshitish</button>`:`<button class="btn" data-act="bclear">Tozalash</button><button class="btn primary" data-act="bcheck" ${b.picked.length?'':'disabled'}>Tekshirish</button>`}
   <button class="btn ghost" data-act="bexit">Chiqish</button></div></div>`;
  pane.innerHTML=h;
}

/* ----- test ----- */
const norm=s=>s.toLowerCase().replace(/[’`ʼ]/g,"'").replace(/\.$/,'').trim();
function distract(f,i,n,field){ const pool=shuf(idxs(f).filter(j=>j!==i&&W[j][field].toLowerCase()!==W[i][field].toLowerCase())); const out=[],seen=new Set([W[i][field].toLowerCase()]);
  for(const j of pool){ const v=W[j][field].toLowerCase(); if(!seen.has(v)){seen.add(v);out.push(j)} if(out.length>=n) break } return out }
function makeTest(f){
  const ids=shuf(idxs(f)); const ss=shuf((S[f]||[]).map((s,k)=>k)); const Q=[]; let p=0;
  const take=()=>ids[p++%ids.length];
  const plan=[['enuz',5],['uzen',4],['listen',3],['spell',3],['gap',3],['build',2]];

   <div class="set"><span class="label">Ovoz tezligi</span>${seg('rate',[[0.7,'Sekin'],[0.9,'O\'rtacha'],[1,'Oddiy']])}</div>
   <div class="set"><span class="label">So'zni avtomatik o'qish</span>${seg('auto',[[true,'Yoqilgan'],[false,'O\'chirilgan']])}</div>
   <div class="set"><button class="btn" data-act="testvoice">${I.speak} Ovozni sinash</button></div>
   <div class="set"><span class="label">Natijalar</span>${view.confirmReset?`<div class="help">Barcha natijalar o'chiriladi. Ishonchingiz komilmi?</div><div class="cta"><button class="btn bad" data-act="doreset">Ha, o'chirish</button><button class="btn" data-act="noreset">Yo'q</button></div>`:`<button class="btn bad" data-act="askreset">Natijalarni nolga tushirish</button>`}</div>
   <div class="help">${cloudOn?"Natijalaringiz hisobingizga saqlanmoqda: shu linkni telefonda ochsangiz, o'sha joydan davom etasiz.":"Natijalaringiz shu qurilmadagi brauzerda saqlanadi. Brauzer ma'lumotlarini tozalasangiz, natijalar ham o'chadi."}</div></div></div>`;
}

/* ---------- actions ---------- */
function act(a,d,el){
  switch(a){
  case 'home': sess=null; go({name:'home'}); break;
  case 'open': sess=null; go({name:'folder',f:+d.f,tab:d.tab||'cards',restart:true}); break;
  case 'exampage': stopMic(); go({name:'exam'}); break;
  case 'restartf': { const f=view.f; bulk(idxs(f),0,`${f+1}-papka qaytadan boshlandi`); view.mode='new'; view.restart=true; view.custom=null; renderFolder(); break; }
  case 'gopick': view.tab='list'; view.flt='all'; renderFolder(); toast("So'zlarni belgilang va pastdagi «Yodlash» tugmasini bosing"); break;
  case 'markall': { const ids=view.listIds||idxs(view.f); const v=+d.v; bulk(ids,v,v?`${ids.length} ta so'z yodlandi deb belgilandi`:`${ids.length} ta so'zdan belgi olib tashlandi`); renderFolder(); break; }
  case 'sel': { const i=+d.i; view.sel.has(i)?view.sel.delete(i):view.sel.add(i); paneList(document.getElementById('pane'),view.f); break; }
  case 'selall': { const ids=view.listIds||[]; const all=ids.every(i=>view.sel.has(i)); ids.forEach(i=>all?view.sel.delete(i):view.sel.add(i)); paneList(document.getElementById('pane'),view.f); break; }
  case 'selrange': { const ids=[];for(let i=+d.a;i<+d.b;i++) ids.push(i); const all=ids.every(i=>view.sel.has(i)); ids.forEach(i=>all?view.sel.delete(i):view.sel.add(i)); paneList(document.getElementById('pane'),view.f); break; }
  case 'selnone': view.sel.clear(); paneList(document.getElementById('pane'),view.f); break;
  case 'studysel': { const ids=[...view.sel].sort((a,b)=>a-b); view.tab='cards'; view.custom=ids; view.restart=true; renderFolder(); window.scrollTo({top:0}); break; }
  case 'examsel': P.ex=Object.assign(P.ex||{dir:'mix',n:20},{scope:'sel'}); view.tab='exam'; view.X=null; renderFolder(); window.scrollTo({top:0}); break;
  case 'marksel': { const ids=[...view.sel], v=+d.v; bulk(ids,v,v?`${ids.length} ta so'z belgilandi`:`${ids.length} ta so'zdan belgi olindi`); paneList(document.getElementById('pane'),view.f); refreshSub(); break; }
  case 'xcfg': { const c=P.ex; let v=d.v; if(d.k==='n'&&v!=='all') v=+v; c[d.k]=v; save(); paneExam(document.getElementById('pane'),view.name==='exam'?null:view.f); break; }
  case 'xstart': case 'xagain': { const f=view.name==='exam'?null:view.f; view.X=null; examStart(f); paneExam(document.getElementById('pane'),f); window.scrollTo({top:0}); break; }
  case 'xcheck': { const t=document.getElementById('xin'); if(!t||!t.value.trim()){ toast("Javobni yozing yoki mikrofonni bosing"); return } stopMic(); examAnswer([t.value],false); break; }
  case 'xskip': stopMic(); examAnswer([''],false); break;
  case 'mic': startMic(); break;
  case 'xoverride': { const X=view.X,q=X.qs[X.pos]; if(q.res&&!q.res.ok){ q.res.ok=true; X.score++; setLvl(q.i,2); paneExam(document.getElementById('pane'),X.f);} break; }
  case 'xnext': view.X.pos++; paneExam(document.getElementById('pane'),view.X.f); window.scrollTo({top:0}); break;
  case 'xdrill': { const X=view.X; const wr=X.qs.filter(q=>!q.res||!q.res.ok).map(q=>q.i); const f=X.f!=null?X.f:Math.floor(wr[0]/100);
      sess=null; view={name:'folder',f,tab:'cards',restart:true,custom:shuf(wr)}; renderFolder(); window.scrollTo({top:0}); break; }
  case 'tab': stopMic(); view.tab=d.tab; view.T=null; view.build=null; view.X=null; if(d.tab==='cards') view.restart=true; renderFolder(); window.scrollTo({top:0}); break;
  case 'mode': view.mode=d.mode; view.restart=true; paneCards(document.getElementById('pane'),view.f); break;
  case 'dir': P.dir=P.dir==='en'?'uz':'en'; save(); if(sess) sess.flip=false; paneCards(document.getElementById('pane'),view.f); break;
  case 'say': speak(W[+d.i][0]); break;
  case 'sayt': speak(d.t); break;
  case 'ans': answer(+d.k); break;
  case 'cyc': { const i=+d.i; setLvl(i,lvl(i)===2?0:2); paneList(document.getElementById('pane'),view.f); refreshSub(); break; }
  case 'flt': view.flt=d.v; paneList(document.getElementById('pane'),view.f); break;
  case 'rev': view.open[+d.k]=1; paneSents(document.getElementById('pane'),view.f); break;
  case 'build': view.build={k:0}; paneSents(document.getElementById('pane'),view.f); break;
  case 'pick': { const b=view.build,x=b.pool[+d.n]; x.used=1; b.picked.push(x); paneBuild(document.getElementById('pane'),view.f); break; }
  case 'unpick': { const b=view.build,x=b.picked.splice(+d.n,1)[0]; x.used=0; paneBuild(document.getElementById('pane'),view.f); break; }
  case 'bclear': { const b=view.build; b.pool.forEach(x=>x.used=0); b.picked=[]; paneBuild(document.getElementById('pane'),view.f); break; }
  case 'bcheck': { const b=view.build,s=S[view.f][b.k]; b.state=b.picked.map(x=>x.w).join(' ')===s[1]&&b.pool.every(x=>x.used)?'ok':'no'; speak(s[1]); paneBuild(document.getElementById('pane'),view.f); break; }
  case 'bnext': { const b=view.build; if(b.k+1<S[view.f].length) view.build={k:b.k+1}; else { view.build=null; toast("Gap tuzish mashqi tugadi!"); } paneSents(document.getElementById('pane'),view.f); break; }
  case 'bexit': view.build=null; paneSents(document.getElementById('pane'),view.f); break;
  case 'tstart': view.T=makeTest(view.f); paneTest(document.getElementById('pane'),view.f); window.scrollTo({top:0}); break;
  case 'topt': { const q=view.T.Q[view.T.pos]; tAnswer(+d.j===q.i,{pick:+d.j}); break; }
  case 'thint': { const q=view.T.Q[view.T.pos],t=document.getElementById('tin'); t.value=W[q.i][0][0]; t.focus(); break; }
  case 'tcheck': { const q=view.T.Q[view.T.pos],t=document.getElementById('tin'); if(!t.value.trim()) return; tAnswer(norm(t.value)===norm(W[q.i][0]),{val:t.value}); break; }
  case 'tpick': { const q=view.T.Q[view.T.pos],x=q.pool[+d.n]; x.used=1; q.picked.push(x); paneTest(document.getElementById('pane'),view.f); break; }
  case 'tunpick': { const q=view.T.Q[view.T.pos],x=q.picked.splice(+d.n,1)[0]; x.used=0; paneTest(document.getElementById('pane'),view.f); break; }
  case 'tbcheck': { const q=view.T.Q[view.T.pos]; tAnswer(q.picked.map(x=>x.w).join(' ')===q.s[1]&&q.pool.every(x=>x.used)); break; }
  case 'tnext': view.T.pos++; view.T.ans=null; paneTest(document.getElementById('pane'),view.f); break;
  case 'drill': { const wr=[...new Set(view.T.wrong)]; view.T=null; view.tab='cards'; view.custom=shuf(wr); view.restart=true; renderFolder(); break; }
  case 'mixreview': { const k=[];for(let i=0;i<N;i++) if(lvl(i)===2) k.push(i); const pick=shuf(k).slice(0,20); const f=Math.floor(pick[0]/100);
      sess=null; view={name:'folder',f,tab:'cards',restart:true,custom:pick}; renderFolder(); window.scrollTo({top:0}); toast("Turli papkalardan 20 ta so'z"); break; }
  case 'settings': view.confirmReset=false; settings(); break;
  case 'closeset': $layer.innerHTML=''; rerender(); break;
  case 'set': { let v=d.v; if(d.k==='auto') v=v==='true'; else if(d.k!=='size'||v!=='all') v=+v; P[d.k]=v; save(); settings(); break; }
  case 'testvoice': speak('Hello! Welcome to your English words.'); break;
  case 'askreset': view.confirmReset=true; settings(); break;
  case 'noreset': view.confirmReset=false; settings(); break;
  case 'doreset': { const keep={goal:P.goal,auto:P.auto,rate:P.rate,dir:P.dir,size:P.size}; P=Object.assign(blank(),keep); try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}
      if(cloudOn&&ref){ ref.set({L:P.L,best:{},days:{},at:Date.now()}).catch(()=>{}); } view.confirmReset=false; sess=null; $layer.innerHTML=''; toast("Natijalar o'chirildi"); go({name:'home'}); break; }
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='closeset' && e.target.closest('[data-stop]') && !e.target.closest('button[data-act="closeset"]')) return;
  if(el.closest('#scene') && el.dataset.act!=='say') return;
  act(el.dataset.act,el.dataset,el);
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(view.name==='folder'&&view.tab==='cards'&&sess&&sess.q.length){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard()}
    else if(e.key==='ArrowRight'){answer(1)} else if(e.key==='ArrowLeft'){answer(0)}
    else if(e.key==='s'||e.key==='S'){speak(W[sess.q[0]][0])}
  }
  if(e.key==='Escape'&&$layer.innerHTML){ $layer.innerHTML=''; rerender(); }
});
rerender();
})();
</script>

</body></html>
