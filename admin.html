   <div class="sec-h"><div><div class="label">Foydalanuvchilar</div><h2>Faol va bloklanganlar</h2></div></div>
   ${act.length+blk.length?`<div class="list">${act.concat(blk).map(row).join('')}</div>`:`<div class="help">Hali foydalanuvchi yo'q.</div>`}
   <div class="help" style="margin-top:14px">Bloklangan foydalanuvchi ilovaga kira olmaydi, lekin natijalari saqlanadi. O'chirilganda esa hisobi va barcha natijalari butunlay o'chadi.</div></div>`;
}

/* ================= actions ================= */
function act(a,d){
  const F=()=>view.f;
  switch(a){
  case 'nav': go({name:d.v}); break;
  case 'open': sess=null; go({name:'folder',f:+d.f,tab:d.tab||'cards',restart:true}); break;
  case 'tab': stopMic(); view.tab=d.tab; view.T=null; view.X=null; if(d.tab==='cards') view.restart=true; renderFolder(); window.scrollTo({top:0}); break;
  case 'mode': view.mode=d.mode; view.restart=true; view.custom=null; paneCards(pane(),F()); break;
  case 'dir': P.dir=P.dir==='en'?'uz':'en'; save(); if(sess) sess.flip=false; paneCards(pane(),F()); break;
  case 'say': speak(W[+d.i][0]); break;
  case 'sayt': speak(d.t); break;
  case 'saytslow': speak(d.t,.6); break;
  case 'ans': answer(+d.k); break;
  case 'cyc': { const i=+d.i; setLvl(i,lvl(i)===2?0:2); paneList(pane(),F()); refreshSub(); break; }
  case 'flt': view.flt=d.v; paneList(pane(),F()); break;
  case 'rev': view.open[+d.k]=1; paneSents(pane(),F()); break;
  case 'restartf': { const f=F(); bulk(idxs(f),0,`${f+1}-papka qaytadan boshlandi`); view.mode='new'; view.restart=true; view.custom=null; renderFolder(); break; }
  case 'gopick': view.tab='list'; view.flt='all'; renderFolder(); toast("So'zlarni belgilang va pastdagi «Yodlash» tugmasini bosing"); break;
  case 'markall': { const ids=view.listIds||idxs(F()); const v=+d.v; bulk(ids,v,v?`${ids.length} ta so'z yodlandi deb belgilandi`:`${ids.length} ta so'zdan belgi olib tashlandi`); renderFolder(); break; }
  case 'sel': { const i=+d.i; view.sel.has(i)?view.sel.delete(i):view.sel.add(i); paneList(pane(),F()); break; }
  case 'selall': { const ids=view.listIds||[]; const all=ids.every(i=>view.sel.has(i)); ids.forEach(i=>all?view.sel.delete(i):view.sel.add(i)); paneList(pane(),F()); break; }
  case 'selrange': { const ids=[];for(let i=+d.a;i<+d.b;i++) ids.push(i); const all=ids.every(i=>view.sel.has(i)); ids.forEach(i=>all?view.sel.delete(i):view.sel.add(i)); paneList(pane(),F()); break; }
  case 'selnone': view.sel.clear(); paneList(pane(),F()); break;
  case 'studysel': { view.tab='cards'; view.custom=[...view.sel].sort((x,y)=>x-y); view.restart=true; renderFolder(); window.scrollTo({top:0}); break; }
  case 'examsel': P.ex=Object.assign(P.ex||{dir:'mix',n:20},{scope:'sel'}); view.tab='exam'; view.X=null; renderFolder(); window.scrollTo({top:0}); break;
  case 'marksel': { const ids=[...view.sel], v=+d.v; bulk(ids,v,v?`${ids.length} ta so'z belgilandi`:`${ids.length} ta so'zdan belgi olindi`); paneList(pane(),F()); refreshSub(); break; }
  /* test */
  case 'tstart': view.T=makeTest(F()); paneTest(pane(),F()); window.scrollTo({top:0}); break;
  case 'topt': { const q=view.T.Q[view.T.pos]; tAnswer(+d.j===q.i,{pick:+d.j}); break; }
  case 'thint': { const q=view.T.Q[view.T.pos],t=$('tin'); t.value=W[q.i][0][0]; t.focus(); break; }
  case 'tcheck': { const q=view.T.Q[view.T.pos],t=$('tin'); if(!t.value.trim()) return; tAnswer(normT(t.value)===normT(W[q.i][0]),{val:t.value}); break; }
  case 'tpick': { const q=view.T.Q[view.T.pos],x=q.pool[+d.n]; x.used=1; q.picked.push(x); paneTest(pane(),F()); break; }
  case 'tunpick': { const q=view.T.Q[view.T.pos],x=q.picked.splice(+d.n,1)[0]; x.used=0; paneTest(pane(),F()); break; }
  case 'tbcheck': { const q=view.T.Q[view.T.pos]; tAnswer(q.picked.map(x=>x.w).join(' ')===q.s[1]&&q.pool.every(x=>x.used)); break; }
  case 'tnext': view.T.pos++; view.T.ans=null; paneTest(pane(),F()); break;
  case 'drillwrong': { const wr=[...new Set(view.T.wrong)]; view.T=null; view.tab='cards'; view.custom=shuf(wr); view.restart=true; renderFolder(); break; }
  case 'mixreview': { const k=[];for(let i=0;i<N;i++) if(lvl(i)===2) k.push(i); const pick=shuf(k).slice(0,20); sess=null; go({name:'folder',f:Math.floor(pick[0]/100),tab:'cards',restart:true,custom:pick}); toast("Turli papkalardan 20 ta so'z"); break; }
  case 'hardreview': case 'hardest': { let ids=[]; if(a==='hardest') ids=hardest().map(x=>x[0]); else { for(let i=0;i<N;i++) if(lvl(i)===1) ids.push(i); ids=ids.slice(0,30); } if(!ids.length) return; sess=null; go({name:'folder',f:Math.floor(ids[0]/100),tab:'cards',restart:true,custom:shuf(ids)}); toast(`${ids.length} ta qiyin so'z`); break; }
  /* exam */
  case 'exampage': go({name:'exam'}); break;
  case 'xcfg': { const c=P.ex; let v=d.v; if(d.k==='n'&&v!=='all') v=+v; c[d.k]=v; save(); paneExam(pane(),view.name==='exam'?null:F()); break; }
  case 'xstart': case 'xagain': { const f=view.name==='exam'?null:F(); view.X=null; examStart(f); paneExam(pane(),f); window.scrollTo({top:0}); break; }
  case 'xcheck': { const t=$('xin'); if(!t||!t.value.trim()){ toast("Javobni yozing yoki mikrofonni bosing"); return } stopMic(); examAnswer([t.value]); break; }
  case 'xskip': stopMic(); examAnswer(['']); break;
  case 'xmic': { const X=view.X,q=X.qs[X.pos]; listen(q.dir==='en'?'uz-UZ':'en-US','micbtn','micnote',t=>{const i=$('xin'); if(i) i.value=t},fin=>{ if(view.X===X&&X.qs[X.pos]===q) examAnswer(fin,true) }); break; }
  case 'xoverride': { const X=view.X,q=X.qs[X.pos]; if(q.res&&!q.res.ok){ q.res.ok=true; X.score++; setLvl(q.i,2); logA('c'); paneExam(pane(),X.f);} break; }
  case 'xnext': view.X.pos++; paneExam(pane(),view.X.f); window.scrollTo({top:0}); break;
  case 'xdrill': { const X=view.X; const wr=X.qs.filter(q=>!q.res||!q.res.ok).map(q=>q.i); sess=null; go({name:'folder',f:X.f!=null?X.f:Math.floor(wr[0]/100),tab:'cards',restart:true,custom:shuf(wr)}); break; }
  /* practice */
  case 'drill': startDrill(d.m,P.pscope,null); break;
  case 'drillf': startDrill(d.m,String(F()),{name:'folder',f:F(),tab:'sents'}); break;
  case 'drillback': { stopMic(); clearInterval(sprintT); const b=view.D&&view.D.back; go(b||{name:'practice'}); break; }
  case 'dagain': { const D=view.D; stopMic(); clearInterval(sprintT); startDrill(D.m,D.scope,D.back); break; }
  case 'dnext': { const D=view.D; D.pos++; D.cur=null; D.tl=null; stopMic(); renderDrill(); window.scrollTo({top:0}); break; }
  case 'dskip': { const D=view.D; stopMic(); sentScore(D,0,{given:'',html:wdiff(curSent(D).s[1],'').html}); renderDrill(); break; }
  case 'dshow': { const D=view.D; const {s}=curSent(D); toast(s[1]); break; }
  case 'dhint': { const D=view.D; toast(W[D.items[D.pos]][3]); break; }
  case 'dcheck': { const D=view.D; if(D.m==='sozdiktant'){ const i=D.items[D.pos], t=$('din'), v=t?t.value.trim():''; if(!v){ toast("Avval so'zni yozing"); return }
        const ok=normE(v)===normE(W[i][0]); D.cur={ok,given:v}; D.res.push(ok?1:0); D.score+=ok?10:0; answered(ok); if(!ok){ miss(i); if(lvl(i)===2) setLvl(i,1); } speak(W[i][0]); renderDrill(); break; }
      const {s}=curSent(D); const t=$('din'); const v=t?t.value.trim():''; if(!v){ toast("Avval javobni yozing"); return }
      if(D.m==='bosh'){ const ok=normE(v)===normE(s[0]); sentScore(D,ok?1:0,{given:v,ok}); speak(s[1]); }
      else { const r=wdiff(s[1],v,D.m==='tarjima'); sentScore(D,r.score,{given:v,html:r.html}); if(D.m==='tarjima') speak(s[1]); }
      renderDrill(); break; }
  case 'pmic': { const D=view.D; const {s}=curSent(D); listen('en-US','pmic','pnote',null,fin=>{ let best=null; for(const t of fin){ const r=wdiff(s[1],t,true); if(!best||r.score>best.score) best=Object.assign(r,{heard:t}); }
      if(D.cur){ D.res.pop(); D.score-=Math.round(D.cur.score*10); } sentScore(D,best.score,{html:best.html,heard:best.heard}); renderDrill(); }); break; }
  case 'pself': { const D=view.D; const {s}=curSent(D); sentScore(D,1,{html:wdiff(s[1],s[1]).html}); renderDrill(); break; }
  case 'tmic': { listen('en-US','tmic','tnote',t=>{const i=$('din'); if(i) i.value=t},fin=>{ const i=$('din'); if(i) i.value=fin[0]; act('dcheck',{}); }); break; }
  case 'pick': { const D=view.D,x=D.tl[+d.n]; x.used=1; D.tp.push(x); renderDrill(); break; }
  case 'unpick': { const D=view.D,x=D.tp.splice(+d.n,1)[0]; x.used=0; renderDrill(); break; }
  case 'bclear': { const D=view.D; D.tl.forEach(x=>x.used=0); D.tp=[]; renderDrill(); break; }
  case 'bcheck': { const D=view.D,{s}=curSent(D); const ok=D.tp.map(x=>x.w).join(' ')===s[1]&&D.tl.every(x=>x.used); sentScore(D,ok?1:0,{ok}); speak(s[1]); renderDrill(); break; }
  case 'pp': { const D=view.D, i=+d.i, side=d.s; if(D.matched.has(i)) return; if(side==='l') speak(W[i][0]);
      if(!D.pick||D.pick.side===side){ D.pick={side,i}; renderDrill(); return; }
      const ok=D.pick.i===i; const other=D.pick; D.pick=null; answered(ok);
      if(ok){ D.matched.add(i); if(D.matched.size===D.rounds[D.r].length){ if(D.r+1<D.rounds.length){ D.r++; D.matched=new Set(); D.left=shuf(D.rounds[D.r]); D.right=shuf(D.rounds[D.r]); } else { D.done=true; D.endT=Date.now(); } } renderDrill(); }
      else { D.err++; miss(side==='l'?i:other.i); renderDrill(); [`p${side}${i}`,`p${other.side}${other.i}`].forEach(id=>{const e=$(id); if(e){e.classList.add('no','shake'); setTimeout(()=>e.classList.remove('no','shake'),400)}}); }
      break; }
  case 'sp': sprintAnswer(+d.v); break;
  /* stats */
  case 'smetric': view.metric=d.v; renderStats(); break;
  case 'srange': view.range=+d.v; renderStats(); break;
  /* serverless admin */
  case 'lok': case 'lext': { (async()=>{ const u=await approveUser(d.id,30); if(!u) return toast('Admin kaliti ochilmagan'); ADM.open=u.id; renderAdminLocal(); toast(a==='lok'?`${u.name} uchun ruxsat-link tayyor — unga yuboring`:`Muddat uzaytirildi — yangi linkni yuboring`); })(); break; }
  case 'lshow': ADM.open=ADM.open===d.id?null:d.id; renderAdminLocal(); break;
  case 'lno': case 'ldel': { const us=admUsers(); const u=us.find(x=>x.id===d.id); if(u){ u.status='removed'; delete u.link; } ADM.confirmDel=null; admSave(us); renderAdminLocal(); toast(a==='ldel'?"O'chirildi: ruxsati endi yangilanmaydi":'Rad etildi'); break; }
  case 'lforget': { admSave(admUsers().filter(x=>x.id!==d.id)); renderAdminLocal(); break; }
  case 'laddreq': { const v=($('reqin').value||'').trim(); const m=v.match(/#r=([^&\s]+)/); if(admAddRequest(m?m[1]:v)){ renderAdminLocal() } else toast("So'rov-link noto'g'ri"); break; }
  case 'llock': adminKey=null; location.href=location.pathname; break;
  /* admin */
  case 'arefresh': loadAdmin(); toast('Yangilanmoqda…'); break;
  case 'aset': { (async()=>{ const {error}=await sb.rpc('admin_set_status',{uid:d.id,new_status:d.v}); if(error) return toast("Bajarib bo'lmadi: "+error.message); toast(d.v==='approved'?'Ruxsat berildi':d.v==='rejected'?'Bloklandi':'Saqlandi'); loadAdmin(); })(); break; }
  case 'adelask': ADM.confirmDel=d.id; renderAdmin(); break;
  case 'adelno': ADM.confirmDel=null; renderAdmin(); break;
  case 'adel': { ADM.confirmDel=null; (async()=>{ const {error}=await sb.rpc('admin_delete_user',{uid:d.id}); if(error) return toast("O'chirib bo'lmadi: "+error.message); toast("Foydalanuvchi o'chirildi"); loadAdmin(); })(); break; }
  case 'copylink': { const t=publicLink(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Link nusxalandi')).catch(()=>toast('Linkni belgilab nusxa oling')); break; }
  case 'logout': logout(); break;
  case 'focuson': focusOn(); paneCards(pane(),F()); break;
  case 'focusoff': focusOff(); paneCards(pane(),F()); break;
  /* profile */
  case 'savename': { const v=$('pname').value.trim().replace(/\s+/g,' '); if(sb&&uid){ if(!v) return toast('Ism bo\'sh bo\'lmasin'); sb.rpc('update_my_name',{new_name:v}).then(({error})=>{ if(error) toast("Serverga saqlab bo'lmadi"); }); if(me) me.name=v; } P.name=v; save(); renderProfile(); toast(v?`Saqlandi. Salom, ${v}!`:'Ism olib tashlandi'); if(v&&P.greet) playSeq(greetFiles(true)).catch(()=>tts(`Hello, ${v}! Nice to meet you.`,.95)); break; }
  case 'pset': { let v=d.v; if(d.k==='auto'||d.k==='greet') v=v==='true'; else if(!(d.k==='size'&&v==='all')) v=+v; P[d.k]=v; save(); renderProfile(); break; }
  case 'hearhi': playSeq(greetFiles(false)).catch(()=>tts(spokenGreeting(false),.95)); break;
  case 'testvoice': speak('Hello! This is how your English words will sound.'); break;
  case 'showcode': view.showCode=true; renderProfile(); break;
  case 'copycode': { const t=exportCode(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Kod nusxalandi. Endi uni ikkinchi qurilmaga yuboring.')).catch(()=>{ const el=$('excode'); const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Kod belgilandi — nusxa oling'); }); break; }
  case 'importcode': { const v=$('imcode').value; try{ importCode(v); toast("Natijalar yuklandi va birlashtirildi"); renderProfile(); }catch(e){ toast("Kod noto'g'ri. U SS1. bilan boshlanishi kerak."); } break; }
  case 'askreset': view.confirmReset=true; renderProfile(); break;
  case 'noreset': view.confirmReset=false; renderProfile(); break;
  case 'doreset': { const keep={goal:P.goal,auto:P.auto,rate:P.rate,dir:P.dir,size:P.size,name:P.name,greet:P.greet}; P=Object.assign(blank(),keep); save(); view.confirmReset=false; sess=null; toast("Natijalar o'chirildi"); renderProfile(); break; }
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  if(el.closest('#scene') && el.dataset.act!=='say') return;
  act(el.dataset.act,el.dataset);
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
  if(e.key==='Escape'&&view.focus){ focusOff(); if(view.name==='folder'&&view.tab==='cards') paneCards(pane(),view.f); return; }
  if(view.name==='folder'&&view.tab==='cards'&&sess&&sess.q.length){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard()}
    else if(e.key==='ArrowRight'){answer(1)} else if(e.key==='ArrowLeft'){answer(0)}
    else if(e.key==='s'||e.key==='S'){speak(W[sess.q[0]][0])}
  }
  if(view.name==='drill'&&view.D&&view.D.m==='tezkor'&&!view.D.done){ if(e.key==='ArrowRight') sprintAnswer(1); if(e.key==='ArrowLeft') sprintAnswer(0); }
});
boot();
})();
</script>
