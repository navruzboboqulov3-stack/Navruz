<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>So'z Sandig'i · Admin</title>
<meta name="robots" content="noindex">
<meta name="description" content="2200 ta eng ko'p ishlatiladigan inglizcha so'zni kartochkalar, talaffuz, gaplar, mashqlar va testlar bilan yodlang.">
<meta name="theme-color" content="#0E1F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="So'z Sandig'i">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<script>window.SS_ADMIN=true</script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600;700&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: a mobile-first "mini app" — single column content, fixed bottom tab bar, sub-pages slide in. One bold motif: the ikat stripe. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8ECF4; --fg:#111A2E; --muted:#596379; --line:#D8DEEA;
  --accent:#1D4ED8; --accent-soft:#DCE6FF; --accent-ink:#FFFFFF;
  --teal:#0E9F9A; --sun:#E9A100; --good:#178A4F; --good-soft:#DDF3E6; --bad:#C93B3B; --bad-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(17,26,46,.06),0 8px 24px rgba(17,26,46,.08);
  --nav-bg:rgba(255,255,255,.86);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0C1120; --surface:#151C2F; --surface-2:#1C2540; --fg:#E8ECF6; --muted:#97A1B8; --line:#26304A;
  --accent:#7196FF; --accent-soft:#1E2B55; --accent-ink:#0C1120;
  --teal:#2CC6C0; --sun:#FFC23D; --good:#3FCB82; --good-soft:#123426; --bad:#FF6F6F; --bad-soft:#3A1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --nav-bg:rgba(21,28,47,.88); color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
select{font:inherit;color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ikat{height:10px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--accent) 0 8px,transparent 8px 16px),repeating-linear-gradient(45deg,var(--sun) 0 8px,var(--teal) 8px 16px);opacity:.9}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.page{animation:pageIn .35s cubic-bezier(.2,.7,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;color:#fff;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(120% 75% at 50% 0%,#2856E6 0%,#132A78 50%,#070F2B 100%);
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transition:opacity .55s ease,transform .55s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash.ready .sp-greet{animation-delay:0s}
#splash.ready .sp-act{animation-delay:.12s}
.sp-in{position:relative;z-index:2;display:grid;justify-items:center;gap:18px;text-align:center;max-width:440px;width:100%}
.sp-logo{width:112px;height:112px;position:relative;filter:drop-shadow(0 22px 40px rgba(0,0,0,.4))}
.sp-logo svg{width:100%;height:100%;overflow:visible}
.sp-logo .tile{animation:lgTile .7s cubic-bezier(.2,1.2,.3,1) both;transform-origin:32px 32px}
.sp-logo .sS{stroke-dasharray:100;stroke-dashoffset:100;animation:lgDraw 1.15s .35s cubic-bezier(.65,0,.35,1) forwards}
.sp-logo .sT{opacity:0;animation:lgFade .6s 1.35s ease forwards}
.sp-logo .sA{transform-origin:49px 16px;animation:lgDrop .7s 1.45s cubic-bezier(.3,1.8,.4,1) both}
.sp-logo .glow{opacity:0;transform-origin:49.4px 16px;animation:lgGlow 1.4s 1.8s ease-out both}
@keyframes lgTile{from{transform:scale(.5) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes lgDraw{to{stroke-dashoffset:0}}
@keyframes lgFade{to{opacity:1}}
@keyframes lgDrop{0%{transform:translateY(-22px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes lgGlow{0%{opacity:0;transform:scale(.3)}25%{opacity:.6}100%{opacity:0;transform:scale(3.2)}}
.brandmark{width:44px;height:44px;flex:none;display:block}
.brandmark svg{width:100%;height:100%}
.sp-tabs{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:4px;gap:4px}
.sp-tabs button{flex:1;padding:9px;border-radius:9px;color:rgba(255,255,255,.75);font-weight:600}
.sp-tabs button.on{background:#fff;color:#0E1F5C}
.sp-err{color:#FFB4B4;font-size:14px;min-height:20px}
.sp-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;display:grid;gap:10px;text-align:center}
.sp-card h3{font-size:20px}
.sp-card p{margin:0;color:rgba(255,255,255,.75);font-size:15px}
.sp-spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 1s linear infinite;justify-self:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* focus (full screen) study */
.focus{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;gap:14px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:spFade .25s ease}
.focus .fbar{display:flex;align-items:center;gap:12px;max-width:760px;width:100%;margin:0 auto}
.focus .fbar .goalbar{flex:1}
.focus .fbar .goalbar i{background:var(--accent)}
.focus .fmid{display:grid;align-content:center;max-width:760px;width:100%;margin:0 auto}
.focus .card{height:min(64vh,560px)}
.focus .word{font-size:clamp(48px,14vw,104px)}
.focus .trans{font-size:clamp(34px,9vw,64px)}
.focus .answer{max-width:760px;width:100%;margin:0 auto}
.focus .face{border-radius:28px}

/* admin */
.adm-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.urow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .avatar{width:40px;height:40px;font-size:16px}
.urow .meta{font-size:13px;color:var(--muted)}
.urow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.pending{background:color-mix(in srgb,var(--sun) 25%,transparent);color:var(--fg)}
.pill.approved{background:var(--good-soft);color:var(--good)}
.pill.rejected{background:var(--bad-soft);color:var(--bad)}
.nb{position:relative}
.nb .dotn{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}
.sp-band{height:8px;width:0;border-radius:6px;background:repeating-linear-gradient(135deg,#fff 0 8px,transparent 8px 16px),repeating-linear-gradient(45deg,#E9A100 0 8px,#2CC6C0 8px 16px);animation:spBand .9s .45s cubic-bezier(.6,0,.2,1) forwards}
@keyframes spBand{to{width:min(260px,70vw)}}
.sp-title{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,48px);letter-spacing:-.02em}
.sp-title span{display:inline-block;opacity:0;transform:translateY(18px);animation:spLetter .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spLetter{to{opacity:1;transform:none}}
.sp-greet{display:grid;gap:6px;opacity:0;animation:spFade .6s 1.9s ease forwards}
.sp-greet .en{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,6.5vw,32px)}
.sp-greet .uz{color:rgba(255,255,255,.75);font-size:15px}
.sp-act{display:grid;gap:12px;width:100%;opacity:0;animation:spFade .6s 2.2s ease forwards}
@keyframes spFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sp-input{width:100%;padding:15px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:18px;text-align:center}
.sp-input::placeholder{color:rgba(255,255,255,.55)}
.sp-btn{padding:15px 18px;border-radius:14px;background:#fff;color:#0E1F5C;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.sp-btn[disabled]{opacity:.5}
.sp-btn svg{width:18px;height:18px}
.sp-skip{color:rgba(255,255,255,.7);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.sp-word{position:absolute;font-family:var(--f-display);font-weight:700;color:rgba(255,255,255,.07);white-space:nowrap;animation:drift linear infinite;z-index:1;pointer-events:none}
@keyframes drift{from{transform:translateY(20vh)}to{transform:translateY(-120vh)}}
.sp-wave{display:inline-flex;gap:3px;align-items:center;height:16px;margin-left:6px;vertical-align:middle}
.sp-wave i{width:3px;height:100%;background:#fff;border-radius:2px;animation:wave .9s ease-in-out infinite}
.sp-wave i:nth-child(2){animation-delay:.15s}.sp-wave i:nth-child(3){animation-delay:.3s}.sp-wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--nav-bg);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav .in{max-width:620px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.nb{display:grid;justify-items:center;gap:2px;padding:7px 4px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nb svg{width:23px;height:23px}
.nb.on{color:var(--accent)}
.nb.on .ic{background:var(--accent-soft)}
.nb .ic{padding:3px 16px;border-radius:99px;display:grid;place-items:center;transition:background .2s}

/* ---------- common ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.hello{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;flex:none;position:relative;overflow:hidden}
.avatar.lg{width:78px;height:78px;font-size:34px}
.hello h1{font-size:22px;font-weight:800}
.hello .sub{font-size:13px;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}
.card-s{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.hero{display:grid;gap:16px}
.hero-row{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring b{font-family:var(--f-display);font-size:28px;font-weight:800;display:block;font-variant-numeric:tabular-nums}
.ring small{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:700;display:block;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.goalbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);min-height:46px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm svg{width:16px;height:16px}
.btn[disabled]{opacity:.45;cursor:default}
.sec-h{display:flex;justify-content:space-between;align-items:end;margin:26px 0 12px;gap:12px}
.sec-h h2{font-size:21px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[disabled]{opacity:.45}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.star{background:color-mix(in srgb,var(--sun) 22%,transparent);color:var(--fg)}
.badge.go{background:var(--accent-soft);color:var(--accent)}
.help{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.help b{color:var(--fg)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:56px}
.week div{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:flex-end;height:100%}
.week i{width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}
.week i.zero{background:var(--surface-2)}
.week span{font-size:10.5px;color:var(--muted)}
.week .t span{color:var(--fg);font-weight:700}
.plan{display:grid;gap:8px}
.task{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.task .tk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.task .tk svg{width:15px;height:15px}
.task.done .tk{background:var(--good);border-color:var(--good)}
.task b{font-weight:600;display:block}
.task small{color:var(--muted);font-size:13px}
.task .arr{color:var(--muted)} .task .arr svg{width:18px;height:18px}

/* folders */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.folder{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:16px 14px 14px;display:grid;gap:8px;transition:transform .15s,box-shadow .15s;min-width:0;margin-top:12px}
.folder::before{content:"";position:absolute;top:-12px;left:-1px;width:58%;height:13px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:10px 12px 0 0}
.folder:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.folder .fn{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.folder .range{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.folder .bar i{display:block;height:100%;background:var(--accent)}
.folder .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.folder.done{border-color:var(--good)}
.folder.done::before{border-color:var(--good);background:var(--good-soft)}
.folder.done .fn{color:var(--good)}
.folder.done .bar i{background:var(--good)}

/* folder view */
.fhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.fhead h2{font-size:24px}
.fhead .sub{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:14px;margin-bottom:18px;overflow-x:auto}
.tab{flex:1;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.tab svg{width:17px;height:17px}
.tab.on{background:var(--accent);color:var(--accent-ink)}

/* flashcard */
.study{display:grid;gap:16px;max-width:560px;margin:0 auto}
.sprog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sprog .goalbar{flex:1}
.sprog .goalbar i{background:var(--accent)}
.scene{perspective:1200px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{position:relative;height:340px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 22px;text-align:center;gap:10px;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face .band{position:absolute;left:0;right:0;top:0;height:10px;border-radius:0}
.face .num{position:absolute;top:20px;left:18px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.face .st{position:absolute;top:18px;right:16px}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,11vw,60px);letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
.ipa{font-family:var(--f-ipa);font-size:20px;color:var(--muted)}
.read{font-size:16px;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:10px;font-weight:600;letter-spacing:.02em}
.read small{font-weight:500;opacity:.8;margin-right:4px}
.trans{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1.15;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted);position:absolute;bottom:16px;left:0;right:0}
.speak{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.speak svg{width:24px;height:24px}
.speak.sm{width:38px;height:38px;box-shadow:none}
.speak.sm svg{width:18px;height:18px}
.speak.soft{background:var(--accent-soft);color:var(--accent)}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer .btn{min-height:58px;font-size:17px}
.kbd{font-size:12px;color:var(--muted);text-align:center}
.card.swl{transform:translateX(-120%) rotate(-12deg);opacity:0;transition:transform .3s,opacity .3s}
.card.swr{transform:translateX(120%) rotate(12deg);opacity:0;transition:transform .3s,opacity .3s}
.card.flip.swl{transform:rotateY(180deg) translateX(120%) rotate(12deg)}
.card.flip.swr{transform:rotateY(180deg) translateX(-120%) rotate(-12deg)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.list .row.sl{grid-template-columns:28px 30px minmax(0,1fr) auto}
.row:first-child{border-top:0}
.row.sel{background:var(--accent-soft)}
.row .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.row .w{font-weight:700;font-size:17px}
.row .ip{font-family:var(--f-ipa);color:var(--muted);font-size:14px;margin-left:6px;font-weight:400}
.row .t{font-size:14px;color:var(--muted)}
.row .rd{font-size:13px;color:var(--accent);font-weight:600}
.row .acts{display:flex;align-items:center;gap:6px}
.stbtn{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.stbtn.s1{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 25%,transparent)}
.stbtn.s2{border-color:var(--good);background:var(--good);color:#fff}
.stbtn svg{width:14px;height:14px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;margin-bottom:12px}
.ranges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ranges .chip{font-size:13px;padding:6px 10px;font-variant-numeric:tabular-nums}
.ck{width:22px;height:22px;accent-color:var(--accent);cursor:pointer;margin:0}
.selbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--fg);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:var(--shadow);z-index:5}
.selbar b{margin-right:auto;font-variant-numeric:tabular-nums}
.selbar .btn{background:color-mix(in srgb,var(--bg) 14%,transparent);border-color:transparent;color:var(--bg)}
.selbar .btn.primary{background:var(--accent);color:var(--accent-ink)}

/* sentences */
.sents{display:grid;gap:10px}
.sent{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.sent .en{font-size:19px;font-weight:600;line-height:1.35}
.sent mark,.qsent mark{background:transparent;color:var(--accent);font-weight:800;border-bottom:2px solid var(--sun)}
.sent .uz{font-size:15px;color:var(--muted);margin-top:4px}
.reveal{font-size:13px;color:var(--accent);font-weight:600;margin-top:4px;text-decoration:underline;text-underline-offset:3px}

/* questions */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow);display:grid;gap:16px;text-align:center}
.qtype{display:inline-flex;align-self:center;justify-self:center}
.qmain{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,46px);line-height:1.1;overflow-wrap:anywhere}
.qsent{font-size:21px;font-weight:600;line-height:1.45}
.qsent .gap{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;min-height:56px;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.tin{width:100%;padding:14px;font-size:20px;text-align:center;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font-family:var(--f-display);font-weight:700}
textarea.tin{font-family:var(--f-body);font-weight:500;font-size:18px;resize:vertical;min-height:84px;text-align:left}
.tin.ok{border-color:var(--good)} .tin.no{border-color:var(--bad)}
.fb{font-weight:600;min-height:24px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tile{padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:17px}
.built{min-height:60px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.built .tile{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.built.ok{border-color:var(--good);border-style:solid} .built.no{border-color:var(--bad);border-style:solid}
.diff{font-size:20px;line-height:1.7;font-weight:600}
.diff .m{color:var(--good)}
.diff .x{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px}
.diff .e{color:var(--muted);text-decoration:line-through;font-weight:500}
.meter{display:grid;gap:6px;justify-items:center}
.meter b{font-family:var(--f-display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.result{text-align:center;display:grid;gap:14px;justify-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px;color:var(--sun)}
.stars svg{width:34px;height:34px}
.stars .off{color:var(--line)}
.empty{text-align:center;padding:30px 16px;display:grid;gap:12px;justify-items:center}
.empty h3{font-size:24px}
.stamp{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--good);border:3px solid var(--good);border-radius:10px;padding:6px 14px;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-6deg) scale(1.8);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.mic{width:76px;height:76px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;justify-self:center;position:relative;flex:none}
.mic svg{width:32px;height:32px}
.mic.sm{width:54px;height:54px} .mic.sm svg{width:24px;height:24px}
.mic.on{background:var(--bad)}
.mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.ansrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.cfg{display:grid;gap:16px;text-align:left}
.set{display:grid;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.reslist{display:grid;gap:6px;text-align:left;width:100%}
.resrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.resrow>span svg{width:16px;height:16px}
.resrow .ok{color:var(--good)} .resrow .no{color:var(--bad)}
.youans{font-size:14px;color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* practice hub */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mode{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .15s,box-shadow .15s}
.mode:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.mode .mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mode .mi svg{width:22px;height:22px}
.mode.t2 .mi{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.mode.t3 .mi{background:color-mix(in srgb,var(--sun) 20%,transparent);color:color-mix(in srgb,var(--sun) 70%,var(--fg))}
.mode b{display:block;font-size:16px}
.mode small{color:var(--muted);font-size:13px;display:block;line-height:1.35}
.mode .badge{margin-top:6px}
.selectw{position:relative}
.selectw select{appearance:none;-webkit-appearance:none;width:100%;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.selectw::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:8px}
.pbtn{padding:12px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;min-height:54px;overflow-wrap:anywhere;transition:opacity .3s,transform .2s}
.pbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pbtn.done{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.45;pointer-events:none}
.pbtn.no{border-color:var(--bad);background:var(--bad-soft)}
.sprint{display:grid;gap:14px;text-align:center}
.timer{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--teal);transition:width 1s linear}
.sprint .pairw{display:grid;gap:6px;padding:26px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.sprint .pairw .qmain{font-size:clamp(30px,9vw,44px)}
.sprint .eq{color:var(--muted);font-size:14px}
.flash-ok{animation:flok .35s}.flash-no{animation:flno .35s}
@keyframes flok{50%{box-shadow:0 0 0 4px var(--good)}}
@keyframes flno{50%{box-shadow:0 0 0 4px var(--bad)}}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:800;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi em{font-style:normal;font-size:12px;color:var(--good);font-weight:600;display:block;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h3{font-size:17px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bars{position:relative;height:180px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;align-items:end;padding-top:18px;
  background:linear-gradient(var(--line),var(--line)) 0 18px/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 calc(18px + (100% - 18px)/2)/100% 1px no-repeat}
.bars .b{position:relative;height:100%;display:flex;align-items:end;justify-content:center;cursor:default}
.bars .b i{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;transition:height .5s cubic-bezier(.2,.7,.2,1)}
.bars .b.zero i{background:var(--surface-2)}
.bars .b em{position:absolute;bottom:calc(var(--h) + 4px);font-style:normal;font-size:11px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.bars .b:hover i{filter:brightness(1.15)}
.xlab{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.ymax{position:absolute;top:0;left:0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);max-width:100%}
.heat i.l1{background:color-mix(in srgb,var(--accent) 25%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 50%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 75%,var(--surface-2))}
.heat i.l4{background:var(--accent)}
.heat i.fut{background:transparent}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donutw{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.donut{width:150px;height:150px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.donut .c b{font-family:var(--f-display);font-size:26px;font-weight:800}
.donut .c small{font-size:11.5px;color:var(--muted)}
.dl{display:grid;gap:8px}
.dl div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.dl i{width:12px;height:12px;border-radius:3px}
.dl b{font-variant-numeric:tabular-nums}
.line{position:relative;height:170px;margin-left:30px}
.line svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.line .dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:default}
.line .dot.k-test{background:var(--teal)}
.line .yl{position:absolute;left:-30px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.line .gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.hb{display:grid;gap:7px}
.hb .r{display:grid;grid-template-columns:30px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px;cursor:pointer;border-radius:6px}
.hb .r:hover .tr{outline:2px solid var(--accent-soft)}
.hb .n{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.hb .tr{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.hb .tr i{display:block;height:100%;background:var(--good)}
.hb .tr i.l1{background:var(--sun)}
.hb .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.hard{display:grid;gap:6px}
.insight{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--accent-soft);color:var(--fg)}
.insight .mi{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.insight .mi svg{width:20px;height:20px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));font-variant-numeric:tabular-nums}

/* profile */
.prof{display:grid;justify-items:center;gap:10px;text-align:center;padding:10px 0 6px}
.prof h2{font-size:26px}
.namerow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%}
.namerow input,.field{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;width:100%}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach .a{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.ach .a .ai{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.ach .a .ai svg{width:18px;height:18px}
.ach .a.got .ai{background:var(--accent);color:var(--accent-ink)}
.ach .a b{font-size:14px}
.ach .a small{font-size:12px;color:var(--muted)}
.ach .a .goalbar{height:5px}
.ach .a .goalbar i{background:var(--accent)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;max-height:110px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px;user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:95;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);animation:spFade .25s ease}
.toast button{color:var(--sun);font-weight:700;text-decoration:underline;text-underline-offset:3px}

@media (max-width:560px){
  .hero-row{grid-template-columns:1fr;justify-items:center;text-align:center}
  .stats{width:100%}
  .folders{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:8px 4px}
  .card{height:320px}
  .opts{grid-template-columns:1fr}
  .selbar b{flex-basis:100%}
  .urow{grid-template-columns:40px minmax(0,1fr)}
  .urow .acts{grid-column:1/-1;justify-content:flex-start}
  .adm-sum .kpi b{font-size:24px}
  .selbar .btn{flex:1}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .donutw{grid-template-columns:1fr;justify-items:center}
  .dl{width:100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="splash" aria-live="polite"></div>
<div class="wrap" id="app"></div>

let audTok=0;
function stopAudio(){ audTok++; try{AUD.pause()}catch(e){} try{speechSynthesis.cancel()}catch(e){} }
/* resolves 'end' | 'blocked' | 'stopped'; rejects only when the file can't be loaded */
function playFile(src,rate){ const tok=++audTok; try{speechSynthesis.cancel()}catch(e){}
  return new Promise((res,rej)=>{ try{AUD.pause()}catch(e){}
    AUD.onended=()=>res(tok===audTok?'end':'stopped');
    AUD.onerror=()=>{ if(tok===audTok) rej(new Error('load')); else res('stopped') };
    AUD.src=src; AUD.playbackRate=rate||1; try{AUD.preservesPitch=true}catch(e){}
    const p=AUD.play(); if(p&&p.catch) p.catch(err=>{ if(tok!==audTok) return res('stopped'); if(err&&err.name==='NotAllowedError') return res('blocked'); if(err&&err.name==='AbortError') return res('stopped'); rej(err) }); }); }
async function playSeq(list,onStart){ let first=true; for(const src of list){ const r=await playFile(src,1); if(first&&onStart){} first=false; if(r!=='end') return r; } return 'end' }
function speak(t,rate,cb){
  const si=SMAP.get(t), wi=WMAP.get(t); let src=null, r=1;
  if(si){ const slow=rate&&rate<0.8; src=`audio/s/${si}${slow?'_slow':''}.mp3`; r=slow?1:(P.rate<1?Math.max(.85,P.rate):1); }
  else if(wi!=null){ src=`audio/w/${wi}.mp3`; r=P.rate<1?Math.max(.75,P.rate):1; }
  if(!src) return tts(t,rate,cb);
  if(cb) AUD.addEventListener('playing',()=>cb('start'),{once:true});

}

function listen(lang,btnId,noteId,onInterim,onFinal){

  if(rec){ try{rec.stop()}catch(e){} return }

  const r=new SR(); rec=r; r.lang=lang; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  const btn=document.getElementById(btnId), note=document.getElementById(noteId);

  r.onerror=e=>{ const m={'not-allowed':"Mikrofonga ruxsat bering: manzil satridagi qulf belgisini bosing.",'service-not-allowed':"Mikrofonga ruxsat bering.",'no-speech':"Ovoz eshitilmadi. Yana bosib, aniqroq ayting.",'language-not-supported':"Bu qurilma bu tildagi ovozni tanimaydi. Javobni yozib bering.",'network':"Ovozni tanish uchun internet kerak.",'audio-capture':"Mikrofon topilmadi."}[e.error]; if(m) toast(m); };
  r.onend=()=>{ rec=null; const b=document.getElementById(btnId); b&&b.classList.remove('on'); const nt=document.getElementById(noteId); if(nt) nt.textContent='Yana urinish uchun mikrofonni bosing';
    if(finals&&finals.length) onFinal(finals); };

const normE=s=>s.toLowerCase().replace(APOS,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m||!n) return m||n; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c } return p[n] }

const toks=s=>s.split(/\s+/).filter(Boolean);
/* word-level alignment of expected sentence vs answer (LCS) */
function wdiff(expected,got,loose){
  const E=toks(expected), En=E.map(normE), G=toks(got).map(normE).filter(Boolean);
  const eq=(a,b)=>a===b||(loose&&a.length>=5&&lev(a,b)<=1);
  const m=En.length,n=G.length, T=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) T[i][j]=eq(En[i],G[j])?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const hit=new Array(m).fill(false), used=new Array(n).fill(false); let i=0,j=0;
  while(i<m&&j<n){ if(eq(En[i],G[j])){hit[i]=true;used[j]=true;i++;j++} else if(T[i+1][j]>=T[i][j+1]) i++; else j++; }
  const extra=toks(got).filter((w,k)=>normE(w)&&!used[toks(got).map(normE).filter(Boolean).indexOf(normE(w))]&&false);
  const score=m?hit.filter(Boolean).length/m:0;
  const html=E.map((w,k)=>`<span class="${hit[k]?'m':'x'}">${esc(w)}</span>`).join(' ');
  return {score,html,extraCount:n-hit.filter(Boolean).length};
}

/* ================= serverless invite links (admin-signed, ECDSA P-256) ================= */
const ADMIN_PUB={"kty":"EC","crv":"P-256","x":"CI8yGnmblAt0FDXcrmM1zZOnHSbxgdlVLwtAeeVxkwk","y":"X7Qh-g--HmVvAXpoqXknvgL3ly1XeUaOEnAzzkJUM6c"};
const LK={adm:'ss-admin-key',users:'ss-admin-users',dev:'ss-device',tok:'ss-access'};
const b64u={ enc:b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec:s=>{ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)) } };
const tjson=o=>b64u.enc(new TextEncoder().encode(JSON.stringify(o)));
const pjson=s=>JSON.parse(new TextDecoder().decode(b64u.dec(s)));
const lsGet=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null') }catch(e){ return null } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} };
let adminKey=null;
const ECA={name:'ECDSA',namedCurve:'P-256'}, SIG={name:'ECDSA',hash:'SHA-256'};
async function pubKey(){ return crypto.subtle.importKey('jwk',ADMIN_PUB,ECA,false,['verify']) }
async function privFromD(d){ return crypto.subtle.importKey('jwk',{...ADMIN_PUB,d,ext:true},ECA,false,['sign']) }
async function checkD(d){ try{ const k=await privFromD(d); const m=new TextEncoder().encode('ss-check'); const s=await crypto.subtle.sign(SIG,k,m); return await crypto.subtle.verify(SIG,await pubKey(),s,m) }catch(e){ return false } }
async function pwKey(pw,salt){ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']) }
async function wrapD(d,pw){ const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await pwKey(pw,salt),new TextEncoder().encode(d)); return {s:b64u.enc(salt),i:b64u.enc(iv),c:b64u.enc(ct)} }
async function unwrapD(w,pw){ const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u.dec(w.i)},await pwKey(pw,b64u.dec(w.s)),b64u.dec(w.c)); return new TextDecoder().decode(pt) }

  const k=hashParam('k'), r=hashParam('r'), a=hashParam('a'); if(k||r||a) stripHash();
  if(ADMIN_PAGE){
    if(r) sp.req=r;
    if(k){ if(await checkD(k)) return splashAdminFirst(k); return splashShell(`<div class="sp-card"><h3>Admin linki noto'g'ri</h3><p>Bu link to'liq nusxalanmagan bo'lishi mumkin.</p></div>`) }
    if(lsGet(LK.adm)) return splashAdminUnlock();
    return splashShell(`<div class="sp-card"><h3>Bu admin sahifasi</h3><p>Uni faqat adminning shaxsiy linki orqali ochish mumkin.</p><a class="sp-skip" href="${esc(baseURL())}">Ilovaga o'tish</a></div>`);
  }
  if(a) return useToken(a);
  if(lsGet(LK.adm)){ me={is_admin:false}; me=null; rerender(true); return splashLocal() }   /* admin's own device */
  const p=await myAccess();
  if(p&&p.exp>Date.now()) return localEnter(p);
  if(p) return splashGate("Ruxsat muddati tugagan. Adminga yangilash so'rovini yuboring.");
  splashGate();
}

async function boot(){
  if(!WANT_CLOUD){ splashShell(''); setTimeout(()=>localGate().catch(()=>splashShell(`<div class="sp-card"><h3>Brauzeringiz eskirgan</h3><p>Chrome yoki Safari'ning yangi versiyasida oching.</p></div>`)),900); return; }
  splashShell(''); 
  try{ if(!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'); }

/* ----- flashcards ----- */
let sess=null;
function startSession(f,mode,custom){
  let q;
  if(custom) q=custom.slice();
  else if(mode==='review') q=shuf(idxs(f).filter(i=>lvl(i)===2));
  else { const a=idxs(f).filter(i=>lvl(i)!==2); q=a.filter(i=>lvl(i)===1).concat(a.filter(i=>lvl(i)===0)); }
  if(!custom && P.size!=='all') q=q.slice(0,+P.size);
  sess={f,mode,q,total:q.length,good:0,bad:0,flip:false,seen:new Set(),custom:!!custom};
}
function paneCards(el,f){
  if(!sess||sess.f!==f||view.restart){ startSession(f,view.mode||'new',view.custom); view.restart=false; view.custom=null; }
  const mode=sess.mode;
  let h=`<div class="study"><div class="chips" style="margin:0">
    <button class="chip${mode==='new'&&!sess.custom?' on':''}" data-act="mode" data-mode="new">O'rganish</button>
    <button class="chip${mode==='review'&&!sess.custom?' on':''}" data-act="mode" data-mode="review" ${fKnown(f)?'':'disabled'}>Takrorlash (${fKnown(f)})</button>
    ${sess.custom?`<span class="chip on">Tanlangan: ${sess.total}</span>`:''}
    <span style="flex:1"></span><button class="chip" data-act="dir">${P.dir==='en'?'EN → UZ':'UZ → EN'}</button></div>
   <div class="toolbar" style="margin:0"><button class="btn sm" data-act="gopick">${I.pick} Tanlab o'rganish</button><button class="btn sm" data-act="restartf" ${fKnown(f)||idxs(f).some(i=>lvl(i)===1)?'':'disabled'}>${I.restart} Papkani qaytadan boshlash</button><button class="btn sm" data-act="focuson" ${sess.q.length?'':'disabled'}>${I.expand} To'liq ekran</button></div>`;
  if(!sess.q.length&&view.focus) focusOff();
  if(!sess.q.length){
    const all=fKnown(f)>=fSize(f);
    h+=`<div class="qbox empty">${all?'<div class="stamp">Papka yodlandi</div>':''}<h3>${all?"Barakalla! Papkadagi hamma so'zni bilasiz":sess.total?"Seans tugadi":"Bu yerda hozircha so'z yo'q"}</h3>
      <p class="muted" style="margin:0">${sess.total?`${sess.total} ta kartochka ko'rildi. ${fKnown(f)}/${fSize(f)} so'z yodlandi.`:''} ${all?"Endi gaplar, test va sinov bilan mustahkamlang.":''}</p>
      <div class="cta" style="justify-content:center">${all?`<button class="btn primary" data-act="tab" data-tab="exam">${I.mic} Sinov</button><button class="btn" data-act="tab" data-tab="test">${I.test} Test</button>`:`<button class="btn primary" data-act="mode" data-mode="new">Yana davom etish</button>`}
      ${f+1<FOLDERS&&all?`<button class="btn" data-act="open" data-f="${f+1}" data-tab="cards">${f+2}-papka</button>`:''}</div></div></div>`;
    el.innerHTML=h; return;
  }
  const i=sess.q[0], en=P.dir==='en', lv=lvl(i);
  const stB=lv===1?'<span class="badge" style="background:color-mix(in srgb,var(--sun) 25%,transparent);color:var(--fg)">Qiyin</span>':lv===2?'<span class="badge" style="background:var(--good-soft);color:var(--good)">Bilaman</span>':'<span class="badge go">Yangi</span>';
  const front=en?`<div class="word">${esc(W[i][0])}</div><div class="ipa">${esc(W[i][1])}</div>${readHTML(i)}<button class="speak" data-act="say" data-i="${i}" aria-label="Eshitish">${I.speak}</button>`
                :`<div class="trans">${esc(W[i][3])}</div><div class="hint">Inglizchasini eslang, keyin kartochkani bosing</div>`;
  const back=en?`<div class="trans">${esc(W[i][3])}</div><div style="display:flex;align-items:center;gap:10px"><span style="font-weight:700;font-size:20px">${esc(W[i][0])}</span><button class="speak sm soft" data-act="say" data-i="${i}" aria-label="Eshitish">${I.speak}</button></div>${readHTML(i)}`
                :`<div class="word">${esc(W[i][0])}</div><div class="ipa">${esc(W[i][1])}</div>${readHTML(i)}<button class="speak" data-act="say" data-i="${i}" aria-label="Eshitish">${I.speak}</button>`;
  h+=`<div class="sprog"><span>${Math.min(sess.good,sess.total)}/${sess.total}</span><div class="goalbar"><i style="width:${sess.good/sess.total*100}%"></i></div><span>${fKnown(f)}/${fSize(f)}</span></div>
   <div class="scene" id="scene"><div class="card${sess.flip?' flip':''}" id="card" tabindex="0" role="button" aria-label="Kartochkani aylantirish">
    <div class="face front"><div class="band ikat"></div><span class="num">#${i+1}</span><span class="st">${stB}</span>${front}${en?'<div class="hint">Tarjimasini ko\'rish uchun bosing</div>':''}</div>
    <div class="face back"><div class="band ikat"></div><span class="num">#${i+1}</span>${back}</div></div></div>
   <div class="answer"><button class="btn bad" data-act="ans" data-k="0">${I.x} Bilmayman</button><button class="btn good" data-act="ans" data-k="1">${I.check} Bilaman</button></div>
   <div class="kbd">Kompyuterda: Probel — aylantirish, ← bilmayman, → bilaman, S — eshitish</div></div>`;
  if(view.focus){ const sc=`<div class="scene" id="scene"><div class="card${sess.flip?' flip':''}" id="card" tabindex="0" role="button" aria-label="Kartochkani aylantirish">
    <div class="face front"><div class="band ikat"></div><span class="num">#${i+1}</span><span class="st">${stB}</span>${front}${en?'<div class="hint">Tarjimasini ko\'rish uchun bosing</div>':''}</div>
    <div class="face back"><div class="band ikat"></div><span class="num">#${i+1}</span>${back}</div></div></div>`;
    h=`<div class="focus" role="dialog" aria-label="To'liq ekran rejimi"><div class="fbar"><button class="iconbtn" data-act="focusoff" aria-label="Yopish">${I.x}</button><div class="goalbar"><i style="width:${sess.good/sess.total*100}%"></i></div><span class="muted" style="font-variant-numeric:tabular-nums;font-size:14px">${Math.min(sess.good,sess.total)}/${sess.total}</span></div>
     <div class="fmid">${sc}</div><div class="answer"><button class="btn bad" data-act="ans" data-k="0">${I.x} Bilmayman</button><button class="btn good" data-act="ans" data-k="1">${I.check} Bilaman</button></div></div>`; }
  el.innerHTML=h;
  if(P.auto && en && !sess.seen.has(i)){ sess.seen.add(i); setTimeout(()=>speak(W[i][0]),150); }
  bindSwipe();
}
function focusOn(){ view.focus=true; document.body.style.overflow='hidden'; try{ const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen({navigationUI:'hide'}); r&&r.catch&&r.catch(()=>{}) }catch(e){} }
function focusOff(silent){ if(!view.focus) return; view.focus=false; document.body.style.overflow=''; try{ if(document.fullscreenElement) document.exitFullscreen() }catch(e){} }
function flipCard(){ if(!sess||!sess.q.length) return; sess.flip=!sess.flip; const c=$('card'); if(c) c.classList.toggle('flip',sess.flip); if(sess.flip&&P.dir==='uz'&&P.auto) speak(W[sess.q[0]][0]); }
function answer(k){
  if(!sess||!sess.q.length) return; const i=sess.q.shift(); const c=$('card'); logA('r');
  if(k){ setLvl(i,2); sess.good++; }
  else { setLvl(i,1); miss(i); sess.bad++; const at=Math.min(sess.q.length,3+(Math.random()*3|0)); sess.q.splice(at,0,i); sess.seen.delete(i); }
  sess.flip=false;
  if(c){ c.classList.add(k?'swr':'swl'); setTimeout(()=>{ if(view.name==='folder'&&view.tab==='cards'&&pane()) paneCards(pane(),view.f); refreshSub(); },220); }
}
function bindSwipe(){
  const sc=$('scene'), c=$('card'); if(!sc) return;
  let x0=null,y0=0,dx=0,moved=false;
  sc.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; x0=e.clientX;y0=e.clientY;dx=0;moved=false; });
  sc.addEventListener('pointermove',e=>{ if(x0==null) return; dx=e.clientX-x0; if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(e.clientY-y0)){moved=true; c.style.transition='none'; c.style.transform=(sess.flip?'rotateY(180deg) ':'')+`translateX(${sess.flip?-dx:dx}px) rotate(${(sess.flip?-dx:dx)/20}deg)`;} });
  const end=e=>{ if(x0==null) return; const d=dx; x0=null; c.style.transition=''; c.style.transform='';
    if(moved&&Math.abs(d)>90){ answer(d>0?1:0) } else if(!moved && !(e.target.closest&&e.target.closest('button')) && e.type==='pointerup') flipCard(); };
  sc.addEventListener('pointerup',end); sc.addEventListener('pointercancel',end);
}

function paneList(el,f){

  let a=idxs(f); if(flt==='new') a=a.filter(i=>lvl(i)!==2); if(flt==='known') a=a.filter(i=>lvl(i)===2);

  view.listIds=a; const sel=view.sel||(view.sel=new Set()); const allSel=a.length>0&&a.every(i=>sel.has(i));
  const base=f*100, rs=[]; for(let s=0;s<fSize(f);s+=20) rs.push([s,Math.min(fSize(f),s+20)]);
  let h=`<input class="search" id="q" type="search" placeholder="Qidirish: inglizcha yoki o'zbekcha" value="${esc(view.q||'')}">
   <div class="chips"><button class="chip${flt==='all'?' on':''}" data-act="flt" data-v="all">Hammasi</button><button class="chip${flt==='new'?' on':''}" data-act="flt" data-v="new">O'rganilmagan</button><button class="chip${flt==='known'?' on':''}" data-act="flt" data-v="known">Yodlangan</button></div>
   <div class="toolbar"><button class="btn sm" data-act="markall" data-v="2" ${a.length?'':'disabled'}>${I.check} Barchasini belgilash</button><button class="btn sm" data-act="markall" data-v="0" ${a.some(i=>lvl(i))?'':'disabled'}>${I.x} Barcha belgilarni olib tashlash</button></div>
   <div class="ranges"><span class="label" style="margin-right:4px">Tanlash:</span><button class="chip${allSel?' on':''}" data-act="selall">Hammasi</button>${rs.map(([x,y])=>{const ids=[];for(let j=x;j<y;j++)ids.push(base+j);const on=ids.every(i=>sel.has(i));return `<button class="chip${on?' on':''}" data-act="selrange" data-a="${base+x}" data-b="${base+y}">${base+x+1}–${base+y}</button>`}).join('')}${sel.size?`<button class="chip" data-act="selnone">Tozalash</button>`:''}</div>
   <div class="list">`;
  for(const i of a){ const l=lvl(i), on=sel.has(i);
    h+=`<div class="row sl${on?' sel':''}"><input type="checkbox" class="ck" data-act="sel" data-i="${i}" ${on?'checked':''} aria-label="${esc(W[i][0])} tanlash"><span class="n">${i+1}</span><div style="min-width:0"><div><span class="w">${esc(W[i][0])}</span><span class="ip">${esc(W[i][1])}</span></div><div class="rd">${esc(W[i][2])}</div><div class="t">${esc(W[i][3])}</div></div>
     <div class="acts"><button class="speak sm soft" data-act="say" data-i="${i}" aria-label="Eshitish">${I.speak}</button><button class="stbtn s${l}" data-act="cyc" data-i="${i}" aria-label="Yodlandi belgisi">${l===2?I.check:''}</button></div></div>`; }

  for(const [t,n] of [['enuz',5],['uzen',4],['listen',3],['spell',3],['gap',3],['build',2]]) for(let k=0;k<n;k++){
    if(t==='gap'||t==='build'){ const sk=ss.shift(); if(sk==null){Q.push(mk('enuz',take()));continue} const s=S[f][sk]; const i=pool.find(j=>W[j][0]===s[0]);

  const uz=q.dir==='en', vs=uz?uzVariants(q.i):enVariants(q.i), nz=uz?normU:normE; let best=false;

/* ================= drills ================= */
let sprintT=null;
function startDrill(m,scope,back){
  const D0={m,scope,pos:0,score:0,res:[],back:back||null};
  const g=MODES.find(x=>x.id===m).g;
  if(g==='s'){ const pool=sentPool(scope); const kw=([f,k])=>{const i=WMAP.get(S[f][k][0]); return i!=null&&lvl(i)===2};
    const learned=shuf(pool.filter(kw)), rest=shuf(pool.filter(x=>!kw(x)));
    if(m==='diktant'&&learned.length>=3) D0.items=learned.slice(0,10);
    else { D0.items=learned.concat(rest).slice(0,10); if(m==='diktant') D0.note=learned.length?"Yodlagan so'zlaringiz qatnashgan gaplar hali kam, shuning uchun boshqa gaplar ham qo'shildi.":"Hali yodlangan so'z yo'q, shuning uchun papkadagi gaplar olindi. Kartochkalarda so'z yodlasangiz, diktant aynan shu so'zlardan tuziladi."; } }
  else if(g==='d'){ let a=scope==='all'?[...Array(N).keys()].filter(i=>lvl(i)===2):idxs(+scope).filter(i=>lvl(i)===2);
    if(a.length<5){ D0.note="Yodlangan so'zlar hali kam, shuning uchun papkadagi so'zlar ham qo'shildi."; a=a.concat(shuf(wordPool(scope)).filter(i=>!a.includes(i))); }
    D0.items=shuf(a).slice(0,15); }
  else if(m==='juftlik'){ const pool=shuf(wordPool(scope)); D0.rounds=[]; for(let r=0;r<3;r++){ const ws=[],seen=new Set(); for(const i of pool){ const t=tr1(i).toLowerCase(); if(seen.has(t)||D0.rounds.flat().includes(i)) continue; seen.add(t); ws.push(i); if(ws.length===6) break; } if(ws.length>=3) D0.rounds.push(ws); }
    D0.r=0; D0.matched=new Set(); D0.left=shuf(D0.rounds[0]); D0.right=shuf(D0.rounds[0]); D0.start=Date.now(); D0.err=0; D0.pick=null; }
  else if(m==='tezkor'){ D0.pool=wordPool(scope); D0.end=Date.now()+60000; D0.cur=null; D0.seen=0; D0.combo=0; nextSprint(D0); }
  view={name:'drill',D:D0}; rerender(true); window.scrollTo({top:0});
  if(m==='tezkor') sprintT=setInterval(()=>{ const D=view.D; if(!D||D.m!=='tezkor') return clearInterval(sprintT); const left=Math.max(0,D.end-Date.now()); const t=$('tleft'), b=$('tbar'); if(t) t.textContent=Math.ceil(left/1000); if(b) b.style.width=(left/600)+'%'; if(left<=0){ clearInterval(sprintT); D.done=true; renderDrill(); } },250);
}
function nextSprint(D){ const p=D.pool; const i=p[Math.random()*p.length|0]; let j=i; const truth=Math.random()<.5; if(!truth){ for(let k=0;k<20;k++){ j=p[Math.random()*p.length|0]; if(tr1(j).toLowerCase()!==tr1(i).toLowerCase()) break; } if(j===i) j=(i+1)%N; } D.cur={i,j,truth:j===i}; }
function drillHead(title,sub){ const D=view.D; return `<header class="fhead"><button class="iconbtn" data-act="drillback" aria-label="Orqaga">${I.back}</button><div style="min-width:0;flex:1"><h2>${title}</h2><div class="sub">${sub}</div></div></header>` }
const scopeName=s=>s==='all'?'Barcha papkalar':`${+s+1}-papka`;
function renderDrill(){
  const D=view.D, m=MODES.find(x=>x.id===D.m);
  let body='';
  if(m.g==='d'){ body=D.pos>=D.items.length?drillResult(D):wordDict(D); }
  else if(m.g==='s'){
    if(!D.items.length) body=`<div class="qbox empty"><h3>Gap topilmadi</h3></div>`;
    else if(D.pos>=D.items.length) body=drillResult(D);
    else body=sentDrill(D);
  } else if(D.m==='juftlik') body=D.done?drillResult(D):pairsView(D);
  else if(D.m==='tezkor') body=D.done?drillResult(D):sprintView(D);
  $app.innerHTML=`<div>${drillHead(m.t,scopeName(D.scope)+((m.g==='s'||m.g==='d')&&D.items.length?` · ${Math.min(D.pos+1,D.items.length)}/${D.items.length}`:''))}<div class="study">${D.note&&D.pos===0&&!D.cur?`<div class="help">${esc(D.note)}</div>`:''}${body}</div></div>`;
  afterDrill(D);
}
function curSent(D){ const [f,k]=D.items[D.pos]; return {f,k,s:S[f][k]} }
function sentDrill(D){

  const listenBtns=`<div style="display:flex;justify-content:center;gap:12px"><button class="speak" data-act="sayt" data-t="${esc(s[1])}" aria-label="Eshitish">${I.speak}</button><button class="speak soft" data-act="saytslow" data-t="${esc(s[1])}" aria-label="Sekin eshitish">${I.slow}</button></div>`;
  const next=`<button class="btn primary" data-act="dnext" id="dnext">${D.pos+1<D.items.length?'Keyingi gap':'Natijani ko\'rish'}</button>`;

      <textarea class="tin${R?(R.score>=.9?' ok':' no'):''}" id="din" rows="2" placeholder="Eshitganingizni yozing…" ${R?'disabled':''} autocapitalize="sentences" spellcheck="false">${R?esc(R.given):''}</textarea>
      ${R?`<div class="meter"><b>${Math.round(R.score*100)}%</b><span class="muted">to'g'ri yozilgan so'zlar</span></div><div class="diff">${R.html}</div><div class="muted">${esc(s[2])}</div>${next}`

      <div class="cta" style="justify-content:center">${SR?'':`<button class="btn" data-act="pself">${I.check} Takrorladim</button>`}${R?next:`<button class="btn ghost" data-act="dskip">O'tkazib yuborish</button>`}</div></div>`;
  }
  if(D.m==='tarjima'){
    h=`<div class="qbox"><span class="badge go qtype">Inglizchaga tarjima qiling</span><div class="qsent">${esc(s[2])}</div>
      <div class="ansrow"><textarea class="tin${R?(R.score>=.8?' ok':' no'):''}" id="din" rows="2" placeholder="English…" ${R?'disabled':''} autocapitalize="sentences" spellcheck="false">${R?esc(R.given):''}</textarea>${SR&&!R?`<button class="mic sm" id="tmic" data-act="tmic" aria-label="Ovoz bilan">${I.mic}</button>`:''}</div>
      <div class="muted" style="font-size:13px" id="tnote">${R?'':`Kalit so'z: <b>${esc(s[0])}</b>`}</div>
      ${R?`<div class="meter"><b>${Math.round(R.score*100)}%</b><span class="muted">namunaga mos</span></div><div class="help" style="text-align:left"><div class="label" style="margin-bottom:4px">Namuna</div><div class="diff" style="font-size:18px">${R.html}</div></div><div class="cta" style="justify-content:center"><button class="btn" data-act="sayt" data-t="${esc(s[1])}">${I.speak} Eshitish</button>${next}</div>`
        :`<div class="cta" style="justify-content:center"><button class="btn ghost" data-act="dskip">Bilmayman</button><button class="btn primary" data-act="dcheck">Tekshirish</button></div>`}</div>`;
  }
  if(D.m==='tuzish'){
    if(!D.tl){ D.tl=shuf(toks(s[1]).map(w=>({w}))); if(D.tl.map(x=>x.w).join(' ')===s[1]&&D.tl.length>1) D.tl.reverse(); D.tp=[]; }
    h=`<div class="qbox"><span class="badge go qtype">Gap tuzing</span><div class="qsent" style="font-size:19px">${esc(s[2])}</div>
      <div class="built${R?(R.ok?' ok':' no'):''}">${D.tp.map((x,n)=>`<button class="tile" data-act="unpick" data-n="${n}" ${R?'disabled':''}>${esc(x.w)}</button>`).join('')||'<span class="muted" style="font-size:14px">So\'zlarni tartib bilan bosing</span>'}</div>
      <div class="tiles">${D.tl.map((x,n)=>x.used?'':`<button class="tile" data-act="pick" data-n="${n}" ${R?'disabled':''}>${esc(x.w)}</button>`).join('')}</div>
      ${R?`<div class="fb ${R.ok?'ok':'no'}">${R.ok?"To'g'ri!":'To\'g\'ri javob: '+esc(s[1])}</div><div class="cta" style="justify-content:center"><button class="btn" data-act="sayt" data-t="${esc(s[1])}">${I.speak} Eshitish</button>${next}</div>`
        :`<div class="cta" style="justify-content:center"><button class="btn" data-act="bclear">Tozalash</button><button class="btn primary" data-act="bcheck" ${D.tp.length?'':'disabled'}>Tekshirish</button></div>`}</div>`;

    h=`<div class="qbox"><span class="badge go qtype">Tushib qolgan so'zni yozing</span><div class="qsent">${esc(s[1]).replace(re,R?`<span class="gap" style="color:${R.ok?'var(--good)':'var(--bad)'}">${esc(s[0])}</span>`:'<span class="gap">&nbsp;</span>')}</div><div class="muted">${esc(s[2])}</div>
      ${R?'':`<div class="muted" style="font-size:14px">Maslahat: <b>${esc(tr1(i))}</b> · ${s[0].length} ta harf</div>`}
      <input class="tin${R?(R.ok?' ok':' no'):''}" id="din" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="so'z…" value="${R?esc(R.given):''}" ${R?'disabled':''}>
      ${R?`<div class="fb ${R.ok?'ok':'no'}">${R.ok?"To'g'ri!":`To'g'ri javob: ${esc(s[0])}`}</div>${next}`:`<div class="cta" style="justify-content:center"><button class="btn" data-act="sayt" data-t="${esc(s[1])}">${I.speak} Gapni eshitish</button><button class="btn primary" data-act="dcheck">Tekshirish</button></div>`}</div>`;
  }
  return prog+h;
}
function wordDict(D){

  const next=`<button class="btn primary" data-act="dnext" id="dnext">${D.pos+1<D.items.length?"Keyingi so'z":'Natijani ko\'rish'}</button>`;
  return `<div class="sprog"><span>${D.pos+1}/${D.items.length}</span><div class="goalbar"><i style="width:${D.pos/D.items.length*100}%"></i></div><span>${D.res.filter(x=>x===1).length} to'g'ri</span></div>
   <div class="qbox"><span class="badge go qtype">Eshiting va yozing</span>
    <div style="display:flex;justify-content:center;gap:12px"><button class="speak" data-act="say" data-i="${i}" style="width:84px;height:84px" aria-label="Eshitish">${I.speak}</button></div>

    ${R?`<div class="fb ${R.ok?'ok':'no'}">${R.ok?"To'g'ri!":"To'g'ri yozilishi:"}</div><div class="help" style="display:grid;gap:4px;color:var(--fg)"><div class="word" style="font-size:34px">${esc(W[i][0])}</div><div><span class="ipa" style="font-size:16px">${esc(W[i][1])}</span> · ${esc(W[i][2])}</div><div>${esc(W[i][3])}</div></div>${next}`

function afterDrill(D){
  const m=D.m;
  if(MODES.find(x=>x.id===m).g==='d'&&D.pos<D.items.length&&!D.cur){ const i=D.items[D.pos]; setTimeout(()=>speak(W[i][0]),300);
    const din=$('din'); if(din){ if(!('ontouchstart' in window)) din.focus(); din.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); act('dcheck',{})} }); } }
  if(MODES.find(x=>x.id===m).g==='s'&&D.pos<D.items.length&&!D.cur){
    const {s}=curSent(D);
    if(m==='diktant'||m==='talaffuz') setTimeout(()=>speak(s[1]),250);
    const din=$('din'); if(din){ if(!('ontouchstart' in window)) din.focus(); din.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); act('dcheck',{})} }); }
  }
  const nx=$('dnext'); if(nx) nx.focus({preventScroll:true});
}
function sentScore(D,score,extra){ D.cur=Object.assign({score},extra); D.res.push(score); D.score+=Math.round(score*10); const {s}=curSent(D); const i=W.findIndex(w=>w[0]===s[0]); answered(score>=.8); if(score<.8&&i>=0) miss(i); }
function drillResult(D){
  const m=MODES.find(x=>x.id===D.m); let pct, line, rec;
  if(m.g==='s'||m.g==='d'){ pct=Math.round(D.res.reduce((a,b)=>a+b,0)/Math.max(1,D.res.length)*100); line=m.g==='d'?`${D.res.filter(x=>x===1).length} / ${D.res.length} ta so'z to'g'ri yozildi`:`${D.res.length} ta gap · o'rtacha ${pct}%`; rec=pct; }
  else if(D.m==='juftlik'){ const sec=Math.round((D.endT-D.start)/1000), tot=D.rounds.flat().length; pct=Math.round(tot/(tot+D.err)*100); line=`${tot} ta juftlik · ${sec} soniya · ${D.err} ta xato`; rec=sec; D.sec=sec; }
  else { pct=D.seen?Math.round(D.score/D.seen*100):0; line=`${D.score} ta to'g'ri javob · ${D.seen} ta savoldan`; rec=D.score; }
  if(!D.saved){ D.saved=true; const prev=P.pbest[D.m]; let better;
    if(D.m==='juftlik') better=prev==null||rec<prev; else better=prev==null||rec>prev;
    if(better) P.pbest[D.m]=rec; D.newRec=better&&prev!=null;
    hist(D.m,D.m==='tezkor'?D.score:pct,D.m==='tezkor'?D.seen:(m.g==='s'||m.g==='d'?D.res.length:D.rounds.flat().length),D.scope==='all'?null:+D.scope,D.m==='juftlik'?{sec:D.sec}:null); save(); }
  const big=D.m==='tezkor'?`${D.score}`:D.m==='juftlik'?`${D.sec}s`:`${pct}%`;
  return `<div class="qbox result">${stars(D.m==='tezkor'?Math.min(100,D.score*4):pct)}<div class="big">${big}</div><div class="muted">${line}${D.newRec?' · yangi rekord!':''}</div>
   <div class="cta" style="justify-content:center"><button class="btn primary" data-act="dagain">${I.restart} Yana bir bor</button><button class="btn" data-act="drillback">Mashqlarga qaytish</button></div></div>`;
}

function sprintAnswer(v){ const D=view.D; if(!D||D.m!=='tezkor'||D.done) return; const ok=(v===1)===D.cur.truth; D.seen++; answered(ok);
  if(ok){ D.score++; D.combo++; } else { D.combo=0; miss(D.cur.i); speak(W[D.cur.i][0]); }
  const fl=ok?'flash-ok':'flash-no'; nextSprint(D); renderDrill(); const w=$('spw'); if(w){ w.classList.add(fl); } }

function dayArr(n){ const out=[]; const d=new Date(); d.setDate(d.getDate()-(n-1)); for(let k=0;k<n;k++){ out.push(dkey(d)); d.setDate(d.getDate()+1);} return out }
function barChart(keys,valFn,fmt,unit){
  const vals=keys.map(valFn), mx=Math.max(1,...vals); const nice=mx<=5?5:mx<=10?10:Math.ceil(mx/10)*10;
  const step=keys.length>16?Math.ceil(keys.length/8):keys.length>10?2:1;
  return `<div style="position:relative"><span class="ymax">${nice}</span><div class="bars">${keys.map((k,j)=>{const v=vals[j],hh=v/nice*100; return `<div class="b${v?'':' zero'}" style="--h:${hh}%" data-tip="${fmtD(k)}: ${fmt(v)} ${unit}"><i style="height:${v?Math.max(2,hh):1.5}%"></i>${v&&(v===mx||k===today())&&keys.length<=16?`<em>${fmt(v)}</em>`:''}</div>`}).join('')}</div></div>
   <div class="xlab">${keys.map((k,j)=>`<span>${j%step===0||k===today()?(k===today()?'bugun':new Date(k+'T12:00:00').getDate()):''}</span>`).join('')}</div>`;
}
function heatmap(){
  const weeks=18; const end=new Date(); const start=new Date(); start.setDate(end.getDate()-(weeks*7-1)-((end.getDay()+6)%7>=0?0:0));
  /* align so columns are Mon..Sun */
  const s=new Date(); s.setDate(s.getDate()-((s.getDay()+6)%7)-(weeks-1)*7);
  const vals=[]; let mx=1; const d=new Date(s);
  for(let k=0;k<weeks*7;k++){ const key=dkey(d); const a=P.act[key]||{}; const v=(learnedOn(key))+(a.r||0)+(a.q||0); vals.push({key,v,fut:d>end}); mx=Math.max(mx,v); d.setDate(d.getDate()+1); }
  const lv=v=>!v?0:v<=mx*.25?1:v<=mx*.5?2:v<=mx*.75?3:4;
  return `<div class="heat">${vals.map(x=>x.fut?'<i class="fut"></i>':`<i class="l${lv(x.v)}" data-tip="${fmtD(x.key)}: ${x.v} ta harakat"></i>`).join('')}</div>
   <div class="legend"><span>Kam</span>${[0,1,2,3,4].map(l=>`<i class="heatc l${l}" style="width:12px;height:12px;border-radius:3px;margin:0;background:${['var(--surface-2)','color-mix(in srgb,var(--accent) 25%,var(--surface-2))','color-mix(in srgb,var(--accent) 50%,var(--surface-2))','color-mix(in srgb,var(--accent) 75%,var(--surface-2))','var(--accent)'][l]}"></i>`).join('')}<span>Ko'p</span><span style="margin-left:auto">Har bir katak — bir kun (so'z + takrorlash + javob)</span></div>`;
}
function donut(){
  const k=known(), h=hardCount(), n=N-k-h; const segs=[[k,'var(--good)','Yodlangan'],[h,'var(--sun)','Qiyin'],[n,'var(--surface-2)','Yangi']];
  const r=52,c=2*Math.PI*r; let off=0; const gap=k&&h?1.5:0;
  const arcs=segs.map(([v,col,l])=>{ const len=v/N*c; const s=`<circle cx="60" cy="60" r="${r}" fill="none" style="stroke:${col}" stroke-width="16" stroke-dasharray="${Math.max(0,len-gap)} ${c}" stroke-dashoffset="${-off}" data-tip="${l}: ${v} ta"/>`; off+=len; return s }).join('');
  return `<div class="donutw"><div class="donut"><svg viewBox="0 0 120 120">${arcs}</svg><div class="c"><div><b>${Math.round(k/N*100)}%</b><small>yodlangan</small></div></div></div>
   <div class="dl">${segs.map(([v,col,l])=>`<div><i style="background:${col}"></i><span>${l}</span><b>${v}</b></div>`).join('')}<div class="muted" style="font-size:12.5px;display:block">Qiyin — "Bilmayman" yoki xato javob berilgan so'zlar</div></div></div>`;
}

function hardest(){ return Object.entries(P.miss).map(([i,c])=>[+i,c]).filter(([i])=>i<N).sort((a,b)=>b[1]-a[1]).slice(0,8) }

  const perfect=P.hist.some(h=>(h.k==='test'||h.k==='sinov')&&h.s===100);
  const L=[[I.play,'Birinchi qadam',"1 ta so'z",k,1],[I.target,'Yuzlik',"100 ta so'z",k,100],[I.target,'Besh yuz',"500 ta so'z",k,500],[I.target,'Ming',"1000 ta so'z",k,1000],[I.trophy,"Lug'at ustasi","2200 ta so'z",k,N],
    [I.flame,'Uch kun',"3 kun ketma-ket",bs,3],[I.flame,'Bir hafta',"7 kun ketma-ket",bs,7],[I.flame,'Bir oy',"30 kun ketma-ket",bs,30],[I.cards,'Birinchi papka',"1 papka to'liq",fd,1],[I.cards,'Besh papka',"5 papka to'liq",fd,5],[I.star,'Mukammal',"Test yoki sinovda 100%",perfect?1:0,1]];
  return `<div class="ach">${L.map(([ic,t,d,v,g])=>{const got=v>=g;return `<div class="a${got?' got':''}"><span class="ai">${got?I.check:ic}</span><b>${t}</b><small>${d}</small>${got?'':`<div class="goalbar"><i style="width:${Math.min(100,v/g*100)}%"></i></div>`}</div>`}).join('')}</div>`;
}
function exportCode(){ const o={v:1,L:P.L.replace(/0+$/,''),best:P.best,days:P.days,act:P.act,hist:P.hist.slice(-120),miss:P.miss,pbest:P.pbest,name:P.name,goal:P.goal}; try{ return 'SS1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o)))) }catch(e){ return '' } }
function importCode(code){ code=code.trim(); if(!code.startsWith('SS1.')) throw 0; const o=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));
  const L=(o.L||'').padEnd(N,'0'); let s=''; for(let i=0;i<N;i++){ const a=P.L[i],b=L[i]||'0'; s+=a>b?a:b; } P.L=s;
  for(const k of ['best','days','pbest']) for(const x in (o[k]||{})) if((o[k][x]||0)>(P[k][x]||0)) P[k][x]=o[k][x];
  for(const d in (o.act||{})){ const a=P.act[d]||(P.act[d]={}); for(const f in o.act[d]) a[f]=Math.max(a[f]||0,o.act[d][f]); }
